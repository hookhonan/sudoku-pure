<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="数独">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='38' fill='%231565c0'/><text x='96' y='128' font-size='135' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>9</text></svg>">
<title>数独 - Sudoku Pure</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg-primary);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
}

button {
    border: none;
    background: none;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    -webkit-tap-highlight-color: transparent;
}

:root, [data-theme="light"], [data-theme="auto"] {
    --font-scale: 1.0;
    --bg-primary: #f5f5f5;
    --bg-secondary: #ffffff;
    --bg-board: #ffffff;
    --text-primary: #1a1a2e;
    --text-secondary: #616161;
    --toolbar-bg: #ffffff;
    --toolbar-shadow: 0 1px 3px rgba(0,0,0,0.12);
    --numpad-bg: #ffffff;
    --numpad-shadow: 0 -1px 3px rgba(0,0,0,0.12);
    --num-given: #1a1a2e;
    --num-user: #1565c0;
    --num-error: #d32f2f;
    --num-hint: #2e7d32;
    --num-note: #757575;
    --grid-line: #bdbdbd;
    --grid-thick: #616161;
    --highlight-related: #e3f2fd;
    --highlight-selected: #bbdefb;
    --highlight-same-num: #c8e6c9;
    --selection-border: #1976d2;
    --btn-bg: transparent;
    --btn-hover: #f0f0f0;
    --btn-active: #e3f2fd;
    --btn-active-text: #1565c0;
    --btn-disabled: #bdbdbd;
    --dialog-bg: #ffffff;
    --dialog-text: #1a1a2e;
    --dialog-overlay: rgba(0,0,0,0.4);
    --diff-btn-bg: #f5f5f5;
    --diff-btn-hover: #e3f2fd;
}

[data-theme="dark"] {
    --bg-primary: #121212;
    --bg-secondary: #1e1e1e;
    --bg-board: #1e1e1e;
    --text-primary: #e0e0e0;
    --text-secondary: #9e9e9e;
    --toolbar-bg: #1e1e1e;
    --toolbar-shadow: 0 1px 3px rgba(0,0,0,0.4);
    --numpad-bg: #1e1e1e;
    --numpad-shadow: 0 -1px 3px rgba(0,0,0,0.4);
    --num-given: #ffffff;
    --num-user: #64b5f6;
    --num-error: #ef5350;
    --num-hint: #81c784;
    --num-note: #9e9e9e;
    --grid-line: #424242;
    --grid-thick: #757575;
    --highlight-related: #1a3a4a;
    --highlight-selected: #0d47a1;
    --highlight-same-num: #1b3a1b;
    --selection-border: #42a5f5;
    --btn-bg: transparent;
    --btn-hover: #333333;
    --btn-active: #0d47a1;
    --btn-active-text: #64b5f6;
    --btn-disabled: #616161;
    --dialog-bg: #2c2c2c;
    --dialog-text: #e0e0e0;
    --dialog-overlay: rgba(0,0,0,0.6);
    --diff-btn-bg: #333333;
    --diff-btn-hover: #0d47a1;
}

/* Auto theme follows system preference */
@media (prefers-color-scheme: dark) {
    [data-theme="auto"] {
        --bg-primary: #121212;
        --bg-secondary: #1e1e1e;
        --bg-board: #1e1e1e;
        --text-primary: #e0e0e0;
        --text-secondary: #9e9e9e;
        --toolbar-bg: #1e1e1e;
        --toolbar-shadow: 0 1px 3px rgba(0,0,0,0.4);
        --numpad-bg: #1e1e1e;
        --numpad-shadow: 0 -1px 3px rgba(0,0,0,0.4);
        --num-given: #ffffff;
        --num-user: #64b5f6;
        --num-error: #ef5350;
        --num-hint: #81c784;
        --num-note: #9e9e9e;
        --grid-line: #424242;
        --grid-thick: #757575;
        --highlight-related: #1a3a4a;
        --highlight-selected: #0d47a1;
        --highlight-same-num: #1b3a1b;
        --selection-border: #42a5f5;
        --btn-bg: transparent;
        --btn-hover: #333333;
        --btn-active: #0d47a1;
        --btn-active-text: #64b5f6;
        --btn-disabled: #616161;
        --dialog-bg: #2c2c2c;
        --dialog-text: #e0e0e0;
        --dialog-overlay: rgba(0,0,0,0.6);
        --diff-btn-bg: #333333;
        --diff-btn-hover: #0d47a1;
    }
}

body {
    background: var(--bg-primary);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    height: 100vh;
}

/* ── Start Screen ── */
#start-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 24px;
}
.start-content {
    text-align: center;
    max-width: 360px;
    width: 100%;
}
.start-title {
    font-size: 3rem;
    font-weight: 800;
    color: var(--num-user);
    margin-bottom: 4px;
}
.start-subtitle {
    font-size: 1rem;
    color: var(--text-secondary);
    margin-bottom: 40px;
}
.start-diff-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
}
.start-diff-btn {
    padding: 20px 12px;
    border-radius: 14px;
    font-weight: 700;
    color: var(--text-primary);
    background: var(--bg-secondary);
    border: 2px solid var(--grid-line);
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.start-diff-btn:hover {
    border-color: var(--num-user);
    background: var(--highlight-related);
}
.start-diff-btn:active {
    transform: scale(0.96);
    background: var(--highlight-selected);
}
.start-diff-btn .diff-name {
    font-size: 1.15rem;
}
.start-diff-btn .diff-desc {
    font-size: 0.75rem;
    color: var(--text-secondary);
}
.start-continue {
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--num-user);
    background: var(--highlight-related);
    border: 1px solid var(--num-user);
    transition: all 0.15s;
}
.start-continue:hover { background: var(--highlight-selected); }

/* ── Top Navigation ── */
#top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1px 6px;
    background: var(--bg-primary);
    z-index: 10;
    min-height: 28px;
    width: 100%;
    box-sizing: border-box;
}

.nav-left, .nav-right {
    display: flex;
    align-items: center;
    gap: 2px;
}

/* ── Info Bar ── */
#info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1px 6px;
    background: var(--bg-primary);
    z-index: 10;
    min-height: 26px;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
}

.info-left { flex: 1; }
.info-center { flex: 0 0 auto; text-align: center; }
.info-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }

.timer-icon {
    font-size: 1rem;
}


#difficulty-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--num-user);
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--btn-active);
    white-space: nowrap;
}

#timer-display {
    font-size: 1.1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    min-width: 50px;
    text-align: center;
}

.tool-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: var(--text-primary);
    background: var(--btn-bg);
    transition: background 0.15s;
}
.tool-btn:hover { background: var(--btn-hover); }
.tool-btn:active { background: var(--btn-active); }

/* ── Board Area ── */
#board-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 8px 4px 8px;
    position: relative;
}

#board-canvas {
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

#bottom-spacer {
    flex: 0 0 0%;
    min-height: 0;
}

/* Mobile: push controls up so they sit close to the board */
@media (max-width: 500px) {
    #bottom-spacer {
        flex: 0.5 0.5 0%;
    }
}

/* ── Tool Bar ── */
#toolbar-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 2px 8px;
    width: 100%;
    box-sizing: border-box;
}

.action-btn {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--text-secondary);
    background: var(--btn-bg);
    transition: all 0.15s;
    gap: 1px;
}
.action-btn .icon { font-size: 1.2rem; }
.action-btn:hover { background: var(--btn-hover); }
.action-btn:active { background: var(--btn-active); }
.action-btn.active {
    color: var(--btn-active-text);
    background: var(--btn-active);
}
.action-btn.disabled {
    opacity: 0.35;
    pointer-events: none;
}
.action-btn.auto-note-disabled {
    opacity: 0.4;
}
.auto-note-tooltip {
    position: fixed;
    background: var(--dialog-bg);
    color: var(--text-primary);
    border: 1px solid var(--num-user);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    z-index: 300;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    pointer-events: none;
    animation: dialogIn 0.15s ease;
}
.pause-close-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--btn-hover);
    color: var(--text-secondary);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.pause-close-btn:active { transform: scale(0.9); }

#btn-hint { position: relative; }
#hint-count {
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--num-user);
}

/* ── Number Pad ── */
#numpad {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 0;
    justify-items: center;
    padding: 6px 0 max(6px, env(safe-area-inset-bottom)) 0;
    background: transparent;
    box-shadow: none;
    z-index: 10;
    width: 100%;
    box-sizing: border-box;
}

.num-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: calc(100% - 12px);
    height: 56px;
    border-radius: 8px;
    border: 1.5px solid var(--grid-line);
    color: var(--text-primary);
    background: var(--bg-secondary);
    transition: all 0.12s;
    padding: 4px 2px;
}
.num-btn:hover { background: var(--btn-hover); border-color: var(--num-user); }
.num-btn:active {
    background: var(--btn-active);
    transform: scale(0.93);
}
.num-btn .num-main {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1;
}
.num-btn .num-remain {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1;
}
.num-btn.filled {
    opacity: 0.25;
    pointer-events: none;
}

/* ── Dialogs ── */
#dialog-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--dialog-overlay);
    z-index: 100;
    align-items: center;
    justify-content: center;
}
#dialog-overlay.active {
    display: flex;
}

/* ── Pause Overlay ── */
#pause-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: var(--dialog-overlay);
    z-index: 15;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
}
#pause-overlay.active {
    display: flex;
}
.pause-panel {
    position: relative;
    background: var(--dialog-bg);
    color: var(--dialog-text);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    animation: dialogIn 0.2s ease;
    min-width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}
.pause-panel h2 {
    font-size: 1.3rem;
    margin-bottom: 8px;
    color: var(--text-primary);
}
.pause-btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    width: 100%;
}

.dialog {
    display: none;
    background: var(--dialog-bg);
    color: var(--dialog-text);
    border-radius: 16px;
    padding: 24px;
    min-width: 280px;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    animation: dialogIn 0.2s ease;
}
.dialog.active { display: block; }

@keyframes dialogIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
@keyframes hintIn {
    from { opacity: 0; transform: translateX(-50%) scale(0.9); }
    to { opacity: 1; transform: translateX(-50%) scale(1); }
}

.dialog h2 {
    font-size: 1.3rem;
    margin-bottom: 16px;
    color: var(--text-primary);
}
.dialog h3 {
    font-size: 1rem;
    margin-bottom: 8px;
    color: var(--text-secondary);
}
.dialog p {
    font-size: 0.95rem;
    margin-bottom: 12px;
    color: var(--text-secondary);
}

/* Difficulty buttons */
.diff-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
}
.diff-btn {
    padding: 14px 12px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    background: var(--diff-btn-bg);
    transition: all 0.15s;
    border: 2px solid transparent;
}
.diff-btn:hover {
    background: var(--diff-btn-hover);
    border-color: var(--num-user);
}
.diff-btn:active { transform: scale(0.96); }

.dialog-btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
}
.dialog-btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: all 0.15s;
}
.dialog-btn.primary {
    color: #fff;
    background: var(--num-user);
}
.dialog-btn.primary:hover { filter: brightness(1.1); }
.dialog-btn.secondary {
    color: var(--text-secondary);
    background: var(--diff-btn-bg);
}
.dialog-btn.secondary:hover { background: var(--btn-hover); }

/* Victory dialog extras */
#victory-time {
    font-size: 2rem;
    font-weight: 700;
    color: var(--num-user);
    margin: 8px 0;
}
#victory-best {
    color: #ff6b6b;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 8px;
}

/* Settings */
.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--grid-line);
}
.setting-row:last-child { border-bottom: none; }
.setting-row label {
    font-size: 0.95rem;
    color: var(--text-primary);
}
.setting-row select {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--grid-line);
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-size: 0.9rem;
}

/* Toggle switch */
.toggle {
    position: relative;
    width: 44px;
    height: 24px;
}
.toggle input { display: none; }
.toggle .slider {
    position: absolute;
    inset: 0;
    background: #bdbdbd;
    border-radius: 12px;
    transition: 0.2s;
    cursor: pointer;
}
.toggle .slider::before {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    top: 2px;
    left: 2px;
    transition: 0.2s;
}
.toggle input:checked + .slider { background: var(--num-user); }
.toggle input:checked + .slider::before { transform: translateX(20px); }

/* Shake animation */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
}

/* Responsive */
@media (min-width: 600px) {
    #board-container { padding: 0 16px 10px 16px; }
    #top-nav { padding: 2px 14px; }
    #info-bar { padding: 1px 14px; }
    .num-btn .num-main { font-size: 1.5rem; }
    #toolbar-actions { gap: 8px; padding: 4px 16px; }
    .action-btn { width: 48px; height: 48px; }
}



.num-btn.note-highlight {
    background: var(--highlight-selected);
    border-color: var(--num-user);
    outline: 2px solid var(--num-user);
    outline-offset: -2px;
}
.num-btn.note-highlight .num-main { color: var(--num-user); font-weight: 700; }
.num-btn.note-highlight .num-remain { color: var(--num-user); opacity: 0.7; }

.num-btn.last-candidate {
    background: var(--num-user);
    border-color: var(--num-user);
    animation: pulse 0.8s infinite;
}
.num-btn.last-candidate .num-main { color: #fff; font-weight: 800; }
.num-btn.last-candidate .num-remain { color: rgba(255,255,255,0.7); }

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}


#hint-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--dialog-overlay);
    z-index: 150;
}
#hint-backdrop.active {
    display: block;
}
#smart-hint {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dialog-bg);
    color: var(--text-primary);
    border: 2px solid var(--num-user);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 0.9rem;
    z-index: 200;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    animation: hintIn 0.2s ease;
    max-width: 94vw;
    width: auto;
    min-width: 280px;
}
.smart-hint-text {
    flex: 1 1 100%;
    font-weight: 600;
    line-height: 1.5;
    word-break: break-word;
    overflow-wrap: break-word;
}
.smart-hint-btn {
    padding: 8px 20px;
    border-radius: 8px;
    background: var(--num-user);
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
    flex: 1;
    min-width: 80px;
}
.smart-hint-btn:hover { filter: brightness(1.2); }
.smart-hint-btn:active { transform: scale(0.96); }
.smart-hint-close {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--dialog-bg);
    background: var(--text-secondary);
    color: var(--dialog-bg);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.smart-hint-close:active { transform: scale(0.9); }


#hearts-display {
    font-size: 1.2rem;
    letter-spacing: 1px;
}
.heart-lost { opacity: 0.25; }
.num-btn.impossible {
    opacity: 0.2;
    pointer-events: none;
    color: var(--btn-disabled);
}
#gameover-time {
    font-size: 2rem;
    font-weight: 700;
    color: var(--num-error);
    margin: 8px 0;
}


.level-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
}
.level-back {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    color: var(--text-secondary);
    background: var(--diff-btn-bg);
    margin-bottom: 16px;
    cursor: pointer;
}
.level-back:hover { background: var(--btn-hover); }
.level-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 16px;
}

<script>

// === js/core/validator.js ===
class Validator {
    static getBoxIndex(row, col) {
        return Math.floor(row / 3) * 3 + Math.floor(col / 3);
    }

    static isValidPlacement(grid, row, col, num) {
        for (let c = 0; c < 9; c++) {
            if (grid[row][c] === num && c !== col) return false;
        }
        for (let r = 0; r < 9; r++) {
            if (grid[r][col] === num && r !== row) return false;
        }
        const br = Math.floor(row / 3) * 3;
        const bc = Math.floor(col / 3) * 3;
        for (let r = br; r < br + 3; r++) {
            for (let c = bc; c < bc + 3; c++) {
                if (grid[r][c] === num && (r !== row || c !== col)) return false;
            }
        }
        return true;
    }

    static findConflicts(grid) {
        const conflicts = new Set();
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (grid[r][c] === 0) continue;
                if (!this.isValidPlacement(grid, r, c, grid[r][c])) {
                    conflicts.add(`${r},${c}`);
                }
            }
        }
        return conflicts;
    }

    static isComplete(grid) {
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (grid[r][c] === 0) return false;
            }
        }
        const conflicts = this.findConflicts(grid);
        return conflicts.size === 0;
    }

    static getCandidates(grid, row, col) {
        if (grid[row][col] !== 0) return [];
        const used = new Set();
        for (let i = 0; i < 9; i++) {
            if (grid[row][i] !== 0) used.add(grid[row][i]);
            if (grid[i][col] !== 0) used.add(grid[i][col]);
        }
        const br = Math.floor(row / 3) * 3;
        const bc = Math.floor(col / 3) * 3;
        for (let r = br; r < br + 3; r++) {
            for (let c = bc; c < bc + 3; c++) {
                if (grid[r][c] !== 0) used.add(grid[r][c]);
            }
        }
        const candidates = [];
        for (let n = 1; n <= 9; n++) {
            if (!used.has(n)) candidates.push(n);
        }
        return candidates;
    }

    static getRelatedCells(row, col) {
        const cells = new Set();
        for (let i = 0; i < 9; i++) {
            cells.add(`${row},${i}`);
            cells.add(`${i},${col}`);
        }
        const br = Math.floor(row / 3) * 3;
        const bc = Math.floor(col / 3) * 3;
        for (let r = br; r < br + 3; r++) {
            for (let c = bc; c < bc + 3; c++) {
                cells.add(`${r},${c}`);
            }
        }
        cells.delete(`${row},${col}`);
        return cells;
    }
}


// === js/core/solver.js ===
// import removed

class Solver {
    static solve(grid) {
        const copy = grid.map(row => [...row]);
        if (this._solve(copy)) return copy;
        return null;
    }

    static _solve(grid) {
        const empty = this._findBestEmpty(grid);
        if (!empty) return true;

        const [row, col] = empty;
        const candidates = Validator.getCandidates(grid, row, col);

        for (const num of candidates) {
            grid[row][col] = num;
            if (this._solve(grid)) return true;
            grid[row][col] = 0;
        }
        return false;
    }

    static _findBestEmpty(grid) {
        let best = null;
        let bestCount = 10;
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (grid[r][c] === 0) {
                    const count = Validator.getCandidates(grid, r, c).length;
                    if (count < bestCount) {
                        bestCount = count;
                        best = [r, c];
                        if (count === 0) return best;
                        if (count === 1) return best;
                    }
                }
            }
        }
        return best;
    }

    static hasUniqueSolution(grid) {
        const copy = grid.map(row => [...row]);
        let count = 0;

        const _count = (g) => {
            if (count > 1) return;
            const empty = this._findBestEmpty(g);
            if (!empty) {
                count++;
                return;
            }
            const [row, col] = empty;
            const candidates = Validator.getCandidates(g, row, col);
            for (const num of candidates) {
                g[row][col] = num;
                _count(g);
                g[row][col] = 0;
                if (count > 1) return;
            }
        };

        _count(copy);
        return count === 1;
    }

    static countSolutions(grid, limit = 2) {
        const copy = grid.map(row => [...row]);
        let count = 0;

        const _count = (g) => {
            if (count >= limit) return;
            const empty = this._findBestEmpty(g);
            if (!empty) {
                count++;
                return;
            }
            const [row, col] = empty;
            const candidates = Validator.getCandidates(g, row, col);
            for (const num of candidates) {
                g[row][col] = num;
                _count(g);
                g[row][col] = 0;
                if (count >= limit) return;
            }
        };

        _count(copy);
        return count;
    }
}


// === seeded RNG ===
class SeededRNG {
    constructor(seed) { this.s = this._hash(seed); }
    _hash(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return Math.abs(h) || 1; }
    next() { this.s = (this.s * 1664525 + 1013904223) | 0; return (this.s >>> 0) / 4294967296; }
    shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    randomInt(min, max) { return Math.floor(this.next() * (max - min + 1)) + min; }
}

// === js/core/generator.js ===
// import removed
// import removed

class Generator {
    static DIFFICULTY = {
        easy:   { label: '简单', labelEn: 'Easy',   givenMin: 45, givenMax: 53 },
        medium: { label: '中等', labelEn: 'Medium', givenMin: 38, givenMax: 46 },
        hard:   { label: '困难', labelEn: 'Hard',   givenMin: 31, givenMax: 39 },
        expert: { label: '专家', labelEn: 'Expert', givenMin: 24, givenMax: 32 },
    };

    static generate(difficulty = 'medium') {
        const config = this.DIFFICULTY[difficulty];
        const targetGiven = this._randomInt(config.givenMin, config.givenMax);

        const solution = this._generateFullSolution();
        const puzzle = this._createPuzzle(solution, 81 - targetGiven);

        return { puzzle, solution, difficulty };
    }

    static _generateFullSolution() {
        const grid = Array.from({ length: 9 }, () => Array(9).fill(0));
        this._fillDiagonal(grid);
        return Solver.solve(grid);
    }

    static _fillDiagonal(grid) {
        for (let box = 0; box < 9; box += 4) {
            const nums = this._shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
            const br = Math.floor(box / 3) * 3;
            const bc = (box % 3) * 3;
            let idx = 0;
            for (let r = br; r < br + 3; r++) {
                for (let c = bc; c < bc + 3; c++) {
                    grid[r][c] = nums[idx++];
                }
            }
        }
    }

    static _createPuzzle(solution, holes) {
        const puzzle = solution.map(row => [...row]);
        const positions = this._shuffle(
            Array.from({ length: 81 }, (_, i) => [Math.floor(i / 9), i % 9])
        );

        let removed = 0;
        for (const [r, c] of positions) {
            if (removed >= holes) break;
            const backup = puzzle[r][c];
            puzzle[r][c] = 0;

            if (Solver.hasUniqueSolution(puzzle)) {
                removed++;
            } else {
                puzzle[r][c] = backup;
            }
        }
        return puzzle;
    }

    static _shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    static _randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    static generateSeeded(difficulty, seed) {
        const rng = new SeededRNG(difficulty + '_' + seed);
        const config = this.DIFFICULTY[difficulty];
        // Extract level number from seed (e.g. 'L5' -> 5)
        const levelMatch = seed.match(/\d+/);
        const level = levelMatch ? parseInt(levelMatch[0]) : 15;
        // Progressive difficulty: earlier levels get more given cells
        const totalLevels = 30;
        const progress = (level - 1) / (totalLevels - 1); // 0.0 to 1.0
        const targetGiven = Math.round(config.givenMax - progress * (config.givenMax - config.givenMin));

        const solution = this._generateSeededSolution(rng);
        const puzzle = this._createSeededPuzzle(solution, 81 - targetGiven, rng);

        return { puzzle, solution, difficulty };
    }

    static _generateSeededSolution(rng) {
        const grid = Array.from({ length: 9 }, () => Array(9).fill(0));
        for (let box = 0; box < 9; box += 4) {
            const nums = rng.shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
            const br = Math.floor(box / 3) * 3;
            const bc = (box % 3) * 3;
            let idx = 0;
            for (let r = br; r < br + 3; r++)
                for (let c = bc; c < bc + 3; c++)
                    grid[r][c] = nums[idx++];
        }
        Solver.solve(grid);
        return grid;
    }

    static _createSeededPuzzle(solution, holes, rng) {
        const puzzle = solution.map(row => [...row]);
        const positions = rng.shuffle(
            Array.from({ length: 81 }, (_, i) => [Math.floor(i / 9), i % 9])
        );
        let removed = 0;
        for (const [r, c] of positions) {
            if (removed >= holes) break;
            const backup = puzzle[r][c];
            puzzle[r][c] = 0;
            if (Solver.hasUniqueSolution(puzzle)) {
                removed++;
            } else {
                puzzle[r][c] = backup;
            }
        }
        return puzzle;
    }
}

// === js/game/board.js ===
// import removed

class Board {
    constructor() {
        this.grid = [];
        this.solution = [];
        this.given = [];
        this.notes = [];
        this.initialPuzzle = [];
        this.reset();
    }

    reset() {
        this.grid = Array.from({ length: 9 }, () => Array(9).fill(0));
        this.solution = Array.from({ length: 9 }, () => Array(9).fill(0));
        this.given = Array.from({ length: 9 }, () => Array(9).fill(false));
        this.notes = Array.from({ length: 9 }, () =>
            Array.from({ length: 9 }, () => new Set())
        );
        this.initialPuzzle = Array.from({ length: 9 }, () => Array(9).fill(0));
    }

    load(puzzle, solution) {
        this.reset();
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                this.grid[r][c] = puzzle[r][c];
                this.solution[r][c] = solution[r][c];
                this.initialPuzzle[r][c] = puzzle[r][c];
                if (puzzle[r][c] !== 0) {
                    this.given[r][c] = true;
                }
            }
        }
    }

    getCell(r, c) {
        return this.grid[r][c];
    }

    isGiven(r, c) {
        return this.given[r][c];
    }

    isEmpty(r, c) {
        return this.grid[r][c] === 0;
    }

    isCorrect(r, c) {
        if (this.grid[r][c] === 0) return true;
        return this.grid[r][c] === this.solution[r][c];
    }

    setCell(r, c, value) {
        if (this.given[r][c]) return false;
        this.grid[r][c] = value;
        if (value !== 0) {
            this.notes[r][c].clear();
        }
        return true;
    }

    toggleNote(r, c, num) {
        if (this.given[r][c] || this.grid[r][c] !== 0) return;
        if (this.notes[r][c].has(num)) {
            this.notes[r][c].delete(num);
        } else {
            this.notes[r][c].add(num);
        }
    }

    getNotes(r, c) {
        return this.notes[r][c];
    }

    clearCell(r, c) {
        if (this.given[r][c]) return;
        this.grid[r][c] = 0;
        this.notes[r][c].clear();
    }

    getConflicts() {
        return Validator.findConflicts(this.grid);
    }

    isComplete() {
        return Validator.isComplete(this.grid);
    }

    getHint(r, c) {
        return this.solution[r][c];
    }

    getRowColBoxCells(row, col) {
        const cells = Validator.getRelatedCells(row, col);
        const result = [];
        for (const cell of cells) {
            const [r, c] = cell.split(',').map(Number);
            result.push({ r, c });
        }
        return result;
    }

    autoFillNotes() {
        let count = 0;
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (this.grid[r][c] !== 0) continue;
                const candidates = Validator.getCandidates(this.grid, r, c);
                if (candidates.length > 0) {
                    this.notes[r][c] = new Set(candidates);
                    count++;
                }
            }
        }
        return count;
    }

    removeNoteFromRelated(num, row, col) {
        let removed = 0;
        for (let i = 0; i < 9; i++) {
            if (this.notes[row][i].delete(num)) removed++;
            if (this.notes[i][col].delete(num)) removed++;
        }
        const br = Math.floor(row / 3) * 3;
        const bc = Math.floor(col / 3) * 3;
        for (let r = br; r < br + 3; r++) {
            for (let c = bc; c < bc + 3; c++) {
                if (this.notes[r][c].delete(num)) removed++;
            }
        }
        return removed;
    }

    findSameNumbers(num) {
        const cells = [];
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (this.grid[r][c] === num && num !== 0) {
                    cells.push({ r, c });
                }
            }
        }
        return cells;
    }
}


// === js/game/history.js ===
class History {
    constructor() {
        this.stack = [];
        this.pointer = -1;
    }

    reset() {
        this.stack = [];
        this.pointer = -1;
    }

    push(action) {
        this.stack = this.stack.slice(0, this.pointer + 1);
        this.stack.push(action);
        this.pointer = this.stack.length - 1;
    }

    canUndo() {
        return this.pointer >= 0;
    }

    canRedo() {
        return this.pointer < this.stack.length - 1;
    }

    undo() {
        if (!this.canUndo()) return null;
        const action = this.stack[this.pointer];
        this.pointer--;
        return { ...action, direction: 'undo' };
    }

    redo() {
        if (!this.canRedo()) return null;
        this.pointer++;
        const action = this.stack[this.pointer];
        return { ...action, direction: 'redo' };
    }
}

// === js/game/timer.js ===
class Timer {
    constructor() {
        this.elapsed = 0;
        this.interval = null;
        this.running = false;
        this.listeners = [];
    }

    start() {
        if (this.running) return;
        this.running = true;
        this.interval = setInterval(() => {
            this.elapsed++;
            this._notify();
        }, 1000);
    }

    pause() {
        if (!this.running) return;
        this.running = false;
        clearInterval(this.interval);
        this.interval = null;
    }

    reset() {
        this.pause();
        this.elapsed = 0;
        this._notify();
    }

    getTime() {
        return this.elapsed;
    }

    getFormatted() {
        const m = Math.floor(this.elapsed / 60);
        const s = this.elapsed % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    isRunning() {
        return this.running;
    }

    onChange(fn) {
        this.listeners.push(fn);
    }

    _notify() {
        for (const fn of this.listeners) {
            fn(this.getFormatted(), this.elapsed);
        }
    }
}


// === level manager ===
class LevelManager {
    static LEVELS_PER_DIFFICULTY = 30;
    static DIFF_ORDER = ['easy', 'medium', 'hard', 'expert'];

    constructor() {
        this.progress = {}; // { 'easy_5': { completed: true, bestTime: 120, stars: 3 } }
        this.load();
    }

    load() {
        try {
            const d = JSON.parse(localStorage.getItem('sudoku_levels'));
            if (d) this.progress = d;
        } catch (e) {}
    }

    save() {
        try {
            localStorage.setItem('sudoku_levels', JSON.stringify(this.progress));
        } catch (e) {}
    }

    isCompleted(difficulty, level) {
        const key = difficulty + '_' + level;
        return !!(this.progress[key] && this.progress[key].completed);
    }

    completeLevel(difficulty, level, timeSeconds) {
        const key = difficulty + '_' + level;
        const old = this.progress[key] || {};
        const bestTime = old.bestTime ? Math.min(old.bestTime, timeSeconds) : timeSeconds;
        let stars = 1;
        if (timeSeconds < 300) stars = 3;
        else if (timeSeconds < 600) stars = 2;
        this.progress[key] = { completed: true, bestTime, stars, lastTime: timeSeconds };
        this.save();
        return { bestTime, stars, isNewBest: !old.bestTime || timeSeconds < old.bestTime };
    }

    getBestTime(difficulty, level) {
        const key = difficulty + '_' + level;
        return this.progress[key] ? this.progress[key].bestTime : null;
    }

    getStars(difficulty, level) {
        const key = difficulty + '_' + level;
        return this.progress[key] ? this.progress[key].stars : 0;
    }

    getCurrentLevel(difficulty) {
        for (let i = 1; i <= this.LEVELS_PER_DIFFICULTY; i++) {
            if (!this.isCompleted(difficulty, i)) return i;
        }
        return this.LEVELS_PER_DIFFICULTY; // all completed
    }

    isUnlocked(difficulty, level) {
        // DEBUG: All levels always unlocked
        return true;
    }

    getProgressSummary(difficulty) {
        let completed = 0;
        for (let i = 1; i <= this.LEVELS_PER_DIFFICULTY; i++) {
            if (this.isCompleted(difficulty, i)) completed++;
        }
        return completed;
    }
}

        this.autoNoteUsed = true;
        return true;

    canUse() { return this.remaining > 0; }
    canUseAutoNote() { return !this.autoNoteUsed; }
    load() {}
}


// === js/ui/sound.js ===
class SoundManager {
    constructor() {
        this.sounds = {};
        this.muted = false;
        this.loaded = false;
    }

    async loadAll() {
        const names = [
            'btn_click', 'num_click', 'num_right', 'num_error',
            'eraserecall', 'prop_note', 'prop_notice',
            'grid_right', 'over_success', 'over_fail',
            'chouka', 'chufa', 'hangxing'
        ];

        const promises = names.map(name => {
            return new Promise((resolve) => {
                const audio = new Audio(`assets/sounds/${name}.mp3`);
                audio.preload = 'auto';
                audio.addEventListener('canplaythrough', () => resolve(), { once: true });
                audio.addEventListener('error', () => resolve(), { once: true });
                audio.load();
                this.sounds[name] = audio;
            });
        });

        await Promise.all(promises);
        this.loaded = true;
    }

    play(name) {
        if (!this.muted && this.sounds[name]) {
            const audio = this.sounds[name];
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }
    }

    vibrate(duration = 10) {
        if (!this.muted && navigator.vibrate) {
            navigator.vibrate(duration);
        }
    }

    toggle() {
        this.muted = !this.muted;
        return this.muted;
    }

    isMuted() {
        return this.muted;
    }
}


// === js/ui/renderer.js ===
class Renderer {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.cellSize = 0;
        this.offsetX = 0;
        this.offsetY = 0;
        this.boardSize = 0;
    }

    resize(containerWidth, containerHeight) {
        const dpr = window.devicePixelRatio || 1;
        const size = Math.min(containerWidth, containerHeight);
        this.boardSize = size;
        this.canvas.style.width = size + 'px';
        this.canvas.style.height = size + 'px';
        this.canvas.width = size * dpr;
        this.canvas.height = size * dpr;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.cellSize = size / 9;
    }

    draw(board, state) {
        const ctx = this.ctx;
        const cs = this.cellSize;
        const size = cs * 9;

        // Fill background
        ctx.fillStyle = getComputedStyle(document.documentElement)
            .getPropertyValue('--bg-board').trim() || '#ffffff';
        ctx.fillRect(0, 0, size, size);

        this._drawHighlights(ctx, board, state);
        this._drawGrid(ctx);
        this._drawNumbers(ctx, board, state);
        this._drawNotes(ctx, board, state);
        this._drawSelection(ctx, state);
    }

    _drawHighlights(ctx, board, state) {
        const cs = this.cellSize;
        const { selectedRow, selectedCol } = state;

        // Related cells highlight (same row/col/box)
        if (selectedRow !== null && selectedCol !== null) {
            ctx.fillStyle = getComputedStyle(document.documentElement)
                .getPropertyValue('--highlight-related').trim() || '#e6f0fa';
            const related = board.getRowColBoxCells(selectedRow, selectedCol);
            for (const { r, c } of related) {
                ctx.fillRect(c * cs, r * cs, cs, cs);
            }
            // Selected cell brighter
            ctx.fillStyle = getComputedStyle(document.documentElement)
                .getPropertyValue('--highlight-selected').trim() || '#bbdefb';
            ctx.fillRect(selectedCol * cs, selectedRow * cs, cs, cs);
        }

        // Same number highlight
        if (state.sameNumHighlight !== null && state.sameNumHighlight !== 0) {
            const cells = board.findSameNumbers(state.sameNumHighlight);
            ctx.fillStyle = getComputedStyle(document.documentElement)
                .getPropertyValue('--highlight-same-num').trim() || '#dcedc8';
            for (const { r, c } of cells) {
                ctx.fillRect(c * cs, r * cs, cs, cs);
            }
        }

        // Conflicts
        const conflicts = board.getConflicts();
        for (const key of conflicts) {
            const [r, c] = key.split(',').map(Number);
            ctx.fillStyle = 'rgba(255, 205, 210, 0.6)';
            ctx.fillRect(c * cs, r * cs, cs, cs);
        }
    }

    _drawGrid(ctx) {
        const cs = this.cellSize;
        const size = cs * 9;
        const half = 1.25; // half of 2.5px thick line to keep it in-canvas

        // Thin lines
        ctx.strokeStyle = getComputedStyle(document.documentElement)
            .getPropertyValue('--grid-line').trim() || '#bdbdbd';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 9; i++) {
            ctx.beginPath();
            ctx.moveTo(i * cs, 0);
            ctx.lineTo(i * cs, size);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i * cs);
            ctx.lineTo(size, i * cs);
            ctx.stroke();
        }

        // Thick lines for 3×3 boxes — inset outer edges so full stroke is visible
        ctx.strokeStyle = getComputedStyle(document.documentElement)
            .getPropertyValue('--grid-thick').trim() || '#616161';
        ctx.lineWidth = 2.5;
        for (let i = 0; i <= 9; i += 3) {
            const x = i === 0 ? half : i === 9 ? size - half : i * cs;
            ctx.beginPath();
            ctx.moveTo(x, half);
            ctx.lineTo(x, size - half);
            ctx.stroke();

            const y = i === 0 ? half : i === 9 ? size - half : i * cs;
            ctx.beginPath();
            ctx.moveTo(half, y);
            ctx.lineTo(size - half, y);
            ctx.stroke();
        }
    }

    _drawNumbers(ctx, board, state) {
        const cs = this.cellSize;
        const scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale').trim()) || 1.0;
        const family = '"Segoe UI", system-ui, sans-serif';
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const val = board.getCell(r, c);
                if (val === 0) continue;

                const isGiven = board.isGiven(r, c);
                const isCorrect = board.isCorrect(r, c);
                const isConflict = !isCorrect;
                const isHint = state.hintCell && state.hintCell.r === r && state.hintCell.c === c;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (isGiven) {
                    ctx.fillStyle = getComputedStyle(document.documentElement)
                        .getPropertyValue('--num-given').trim() || '#1a1a2e';
                    ctx.font = `bold ${cs * 0.5 * scale}px ${family}`;
                } else if (isHint) {
                    ctx.fillStyle = getComputedStyle(document.documentElement)
                        .getPropertyValue('--num-hint').trim() || '#1565c0';
                    ctx.font = `${cs * 0.48 * scale}px ${family}`;
                } else if (isConflict) {
                    ctx.fillStyle = getComputedStyle(document.documentElement)
                        .getPropertyValue('--num-error').trim() || '#d32f2f';
                    ctx.font = `${cs * 0.48 * scale}px ${family}`;
                } else {
                    ctx.fillStyle = getComputedStyle(document.documentElement)
                        .getPropertyValue('--num-user').trim() || '#1565c0';
                    ctx.font = `${cs * 0.48 * scale}px ${family}`;
                }

                ctx.fillText(val.toString(), c * cs + cs / 2, r * cs + cs / 2);
            }
        }
    }

    _drawNotes(ctx, board, state) {
        const cs = this.cellSize;
        const noteFontSize = cs * 0.18;
        const boldNum = state.boldNoteNum || 0;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (board.getCell(r, c) !== 0) continue;
                const notes = board.getNotes(r, c);
                if (notes.size === 0) continue;

                const third = cs / 3;
                for (const num of notes) {
                    const nr = Math.floor((num - 1) / 3);
                    const nc = (num - 1) % 3;
                    const x = c * cs + nc * third + third / 2;
                    const y = r * cs + nr * third + third / 2;

                    if (num === boldNum) {
                        ctx.fillStyle = getComputedStyle(document.documentElement)
                            .getPropertyValue('--num-user').trim() || '#1565c0';
                        ctx.font = `bold ${noteFontSize * 1.2}px "Segoe UI", system-ui, sans-serif`;
                    } else {
                        ctx.fillStyle = getComputedStyle(document.documentElement)
                            .getPropertyValue('--num-note').trim() || '#757575';
                        ctx.font = `${noteFontSize}px "Segoe UI", system-ui, sans-serif`;
                    }
                    ctx.fillText(num.toString(), x, y);
                }
            }
        }
    }

    _drawSelection(ctx, state) {
        if (state.selectedRow === null || state.selectedCol === null) return;
        const cs = this.cellSize;
        ctx.strokeStyle = getComputedStyle(document.documentElement)
            .getPropertyValue('--selection-border').trim() || '#1976d2';
        ctx.lineWidth = 2.5;
        const x = state.selectedCol * cs + 1;
        const y = state.selectedRow * cs + 1;
        ctx.strokeRect(x, y, cs - 2, cs - 2);
    }

    getCellFromPoint(x, y) {
        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.boardSize / rect.width;
        const scaleY = this.boardSize / rect.height;
        const cx = (x - rect.left) * scaleX;
        const cy = (y - rect.top) * scaleY;
        const col = Math.floor(cx / this.cellSize);
        const row = Math.floor(cy / this.cellSize);
        if (row >= 0 && row < 9 && col >= 0 && col < 9) {
            return { row, col };
        }
        return null;
    }
}


// === js/ui/animations.js ===
class Animations {
    static celebrate(canvas) {
        const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff922b', '#845ef7', '#ff66c4'];
        const particles = [];
        const rect = canvas.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;

        for (let i = 0; i < 150; i++) {
            particles.push({
                x: cx,
                y: cy,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12 - 3,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: Math.random() * 6 + 2,
                life: 1,
                decay: Math.random() * 0.02 + 0.01,
            });
        }

        // We use a temporary overlay canvas for confetti
        const overlay = document.createElement('canvas');
        overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100;';
        overlay.width = rect.width;
        overlay.height = rect.height;
        canvas.parentElement.appendChild(overlay);
        const ctx = overlay.getContext('2d');

        let frame = 0;
        const animate = () => {
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            let alive = false;

            for (const p of particles) {
                if (p.life <= 0) continue;
                alive = true;
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15; // gravity
                p.life -= p.decay;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }

            if (alive && frame < 120) {
                frame++;
                requestAnimationFrame(animate);
            } else {
                overlay.remove();
            }
        };
        requestAnimationFrame(animate);
    }

    static flashCell(renderer, row, col, color = 'rgba(76,175,80,0.4)', duration = 300) {
        const ctx = renderer.ctx;
        const cs = renderer.cellSize;
        const start = performance.now();

        const anim = (now) => {
            const elapsed = now - start;
            const alpha = 1 - elapsed / duration;
            if (alpha <= 0) return;

            ctx.fillStyle = color.replace(/[\d.]+\)$/, alpha + ')');
            ctx.fillRect(col * cs, row * cs, cs, cs);
            requestAnimationFrame(anim);
        };
        requestAnimationFrame(anim);
    }
}

// === js/ui/input.js ===
class InputHandler {
    constructor(game) {
        this.game = game;
        this._setupStartScreen();
        this._setupCanvasInput();
        this._setupNumPad();
        this._setupToolbar();
        this._setupKeyboard();
    }

    _setupStartScreen() {
        // Difficulty buttons -> show level screen
        document.querySelectorAll('.start-diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const diff = btn.dataset.difficulty;
                this.game._showLevelScreen(diff);
            });
        });

        // Level back button
        document.getElementById('btn-level-back')?.addEventListener('click', () => {
            document.getElementById('level-screen').style.display = 'none';
            document.querySelector('.start-content:not(#level-screen)').style.display = 'block';
        });

        // Random mode button
        document.getElementById('btn-random')?.addEventListener('click', () => {
            this.game.startGame(this.game.difficulty, 'random');
        });

        // Continue button
        document.getElementById('btn-continue')?.addEventListener('click', () => {
            this.game.continueGame();
        });
    }

    _setupCanvasInput() {
        const canvas = this.game.renderer.canvas;

        canvas.addEventListener('click', (e) => {
            const cell = this.game.renderer.getCellFromPoint(e.clientX, e.clientY);
            if (cell) {
                this.game.selectCell(cell.row, cell.col);
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            const cell = this.game.renderer.getCellFromPoint(touch.clientX, touch.clientY);
            if (cell) {
                this.game.selectCell(cell.row, cell.col);
            }
        });
    }

    _setupNumPad() {
        for (let i = 1; i <= 9; i++) {
            const btn = document.getElementById(`num-${i}`);
            if (btn) {
                btn.addEventListener('click', () => {
                    this.game.inputNumber(i);
                });
            }
        }
    }

    _setupToolbar() {
        document.getElementById('btn-home')?.addEventListener('click', () => this.game.goHome());
        document.getElementById('btn-undo')?.addEventListener('click', () => this.game.undo());
        document.getElementById('btn-note')?.addEventListener('click', () => this.game.toggleNoteMode());
        document.getElementById('btn-autonote')?.addEventListener('click', () => this.game.autoNote());
        document.getElementById('btn-erase')?.addEventListener('click', () => this.game.erase());
        document.getElementById('btn-hint')?.addEventListener('click', () => this.game.useHint());
        document.getElementById('btn-pause')?.addEventListener('click', () => this.game.pause());
        document.getElementById('btn-mute')?.addEventListener('click', () => this.game.toggleMute());

        document.getElementById('btn-new-game')?.addEventListener('click', () => {
            document.getElementById('dialog-difficulty').classList.add('active');
            document.getElementById('dialog-overlay').classList.add('active');
        });

        // Unified overlay click
        document.getElementById('dialog-overlay')?.addEventListener('click', (e) => {
            if (e.target !== e.currentTarget) return;
            const diffActive = document.getElementById('dialog-difficulty').classList.contains('active');
            if (diffActive) {
                document.getElementById('dialog-difficulty').classList.remove('active');
                document.getElementById('dialog-overlay').classList.remove('active');
            } else {
                this.game.dialogs.hide();
            }
        });

        // Difficulty selection (in dialogs)
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const diff = btn.dataset.difficulty;
                this.game.dialogs.hide();
                this.game.startGame(diff, 'random');
            });
        });

        // Pause actions
        document.getElementById('btn-resume')?.addEventListener('click', () => this.game.resume());
        document.getElementById('btn-pause-close')?.addEventListener('click', () => this.game.resume());
        document.getElementById('btn-gameover-retry')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            if (this.game.gameMode === 'level') {
                this.game.restartGame();
            } else {
                this.game.startGame(this.game.difficulty, 'random');
            }
        });
        document.getElementById('btn-gameover-home')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            Storage.clearGame();
            this.game.gameStarted = false;
            this.game.currentLevel = 1;
            this.game.gameMode = 'random';
            this.game._showStartScreen();
        });
        document.getElementById('btn-restart')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            this.game.dialogs.showConfirm(
                '重新开始', '确定要重新开始吗？进度将丢失。', () => {
                this.game.restartGame();
            });
        });
        document.getElementById('btn-new-from-pause')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            document.getElementById('dialog-difficulty').classList.add('active');
            document.getElementById('dialog-overlay').classList.add('active');
        });

        // Settings
        document.getElementById('btn-settings')?.addEventListener('click', () => {
            document.getElementById('setting-mute').checked = this.game.sound.isMuted();
            document.getElementById('setting-theme').value = document.documentElement.dataset.theme || 'light';
            document.getElementById('setting-hearts').value = this.game.maxLives;
            document.getElementById('setting-disable').checked = this.game.disableImpossible;
            document.getElementById('setting-autonote').checked = this.game.autoNoteEnabled;
            try {
                document.getElementById('setting-fontsize').value = localStorage.getItem('sudoku_fontSize') || 'medium';
            } catch (e) {}
            this.game.dialogs.showSettings();
        });
        document.getElementById('setting-fontsize')?.addEventListener('change', (e) => {
            this.game._applyFontSize(e.target.value);
        });
        document.getElementById('btn-close-settings')?.addEventListener('click', () => this.game.dialogs.hide());
        document.getElementById('setting-mute')?.addEventListener('change', (e) => {
            if (e.target.checked !== this.game.sound.isMuted()) {
                this.game.toggleMute();
            }
        });
        document.getElementById('setting-theme')?.addEventListener('change', (e) => {
            this.game._applyTheme(e.target.value);
            try {
                localStorage.setItem('sudoku_theme', e.target.value);
            } catch (e) {}
            requestAnimationFrame(() => {
                if (this.game.gameStarted) this.game._render();
            });
        });
        document.getElementById('setting-hearts')?.addEventListener('change', (e) => {
            const v = parseInt(e.target.value);
            if (v < 1 || v > 5) return;
            this.game._applyMaxLives(v);
        });
        document.getElementById('setting-disable')?.addEventListener('change', (e) => {
            this.game.disableImpossible = e.target.checked;
            try { localStorage.setItem('sudoku_disableImpossible', e.target.checked); } catch (e) {}
            this.game._updateNumPadHighlight();
        });
        document.getElementById('setting-autonote')?.addEventListener('change', (e) => {
            this.game.autoNoteEnabled = e.target.checked;
            try { localStorage.setItem('sudoku_autoNoteEnabled', e.target.checked); } catch (e) {}
            this.game._updateAutoNoteButton();
        });

        // Confirm dialog
        document.getElementById('confirm-cancel')?.addEventListener('click', () => this.game.dialogs.hide());

        // Victory actions
        document.getElementById('btn-victory-next')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            this.game.startGame(this.game.difficulty, 'level', this.game.currentLevel + 1);
        });
        document.getElementById('btn-victory-restart')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            this.game.restartGame();
        });
        document.getElementById('btn-victory-home')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            Storage.clearGame();
            this.game.gameStarted = false;
            this.game._showStartScreen();
        });
        document.getElementById('btn-victory-new')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            this.game._showStartScreen();
        });
        document.getElementById('btn-victory-replay')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            this.game.startGame(this.game.difficulty, 'random');
        });
    }

    _setupKeyboard() {
        document.addEventListener('keydown', (e) => {
            if (document.querySelector('.dialog.active') || document.getElementById('pause-overlay').classList.contains('active')) return;
            if (!this.game.gameStarted) return;

            const key = e.key;
            if (key >= '1' && key <= '9') {
                e.preventDefault();
                if (e.ctrlKey || e.metaKey) {
                    this.game.toggleNoteAtSelected(parseInt(key));
                } else {
                    this.game.inputNumber(parseInt(key));
                }
            } else if (key === 'Backspace' || key === 'Delete' || key === '0') {
                e.preventDefault();
                this.game.erase();
            } else if (key === 'n' || key === 'N') {
                e.preventDefault();
                this.game.toggleNoteMode();
            } else if ((key === 'z' || key === 'Z') && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                if (e.shiftKey) {
                    this.game.redo();
                } else {
                    this.game.undo();
                }
            } else if ((key === 'y' || key === 'Y') && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                this.game.redo();
            } else if (key.startsWith('Arrow')) {
                e.preventDefault();
                this.game.moveSelection(key);
            }
        });
    }
}


// === js/data/storage.js ===
class Storage {
    static save(key, data) {
        try {
            localStorage.setItem(key, JSON.stringify(data));
        } catch (e) {}
    }

    static load(key, defaultValue = null) {
        try {
            const raw = localStorage.getItem(key);
            if (raw === null) return defaultValue;
            return JSON.parse(raw);
        } catch (e) {
            return defaultValue;
        }
    }

    static saveGame(state) {
        this.save('sudoku_game', state);
    }

    static loadGame() {
        return this.load('sudoku_game', null);
    }

    static clearGame() {
        try {
            localStorage.removeItem('sudoku_game');
        } catch (e) {}
    }
}


// === js/data/stats.js ===
class Stats {
    constructor() {
        this.data = {
            totalGames: 0,
            totalWins: 0,
            currentStreak: 0,
            bestStreak: 0,
            bestTimes: {},    // { difficulty: seconds }
            avgTimes: {},     // { difficulty: { total: seconds, count: N } }
            byDifficulty: {}, // { difficulty: { played: N, won: N } }
        };
    }

    load() {
        try {
            const saved = JSON.parse(localStorage.getItem('sudoku_stats'));
            if (saved) {
                this.data = { ...this.data, ...saved };
            }
        } catch (e) {}
    }

    save() {
        try {
            localStorage.setItem('sudoku_stats', JSON.stringify(this.data));
        } catch (e) {}
    }

    recordGame(difficulty, won, timeSeconds) {
        const d = this.data;
        d.totalGames++;

        if (!d.byDifficulty[difficulty]) {
            d.byDifficulty[difficulty] = { played: 0, won: 0 };
        }
        d.byDifficulty[difficulty].played++;

        if (won) {
            d.totalWins++;
            d.currentStreak++;
            d.bestStreak = Math.max(d.bestStreak, d.currentStreak);
            d.byDifficulty[difficulty].won++;

            // Best time
            if (!d.bestTimes[difficulty] || timeSeconds < d.bestTimes[difficulty]) {
                d.bestTimes[difficulty] = timeSeconds;
            }

            // Average time
            if (!d.avgTimes[difficulty]) {
                d.avgTimes[difficulty] = { total: 0, count: 0 };
            }
            d.avgTimes[difficulty].total += timeSeconds;
            d.avgTimes[difficulty].count++;
        } else {
            d.currentStreak = 0;
        }
        this.save();
    }

    getSummary() {
        return { ...this.data };
    }

    isNewBest(difficulty, timeSeconds) {
        const best = this.data.bestTimes[difficulty];
        return !best || timeSeconds < best;
    }
}
