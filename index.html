// === js/ui/input.js ===
class InputHandler {
    constructor(game) {
        this.game = game;
        this._setupStartScreen();
        this._setupCanvasInput();
        this._setupNumPad();
        this._setupToolbar();
        this._setupKeyboard();
    }

    _setupStartScreen() {
        // Bottom nav tabs
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => this.game._showTab(btn.dataset.tab));
        });

        // Home: daily card + daily tab play buttons
        document.getElementById('btn-daily-play')?.addEventListener('click', () => {
            this.game.startDaily(this.game.dailyManager.todayKey());
        });
        document.getElementById('btn-daily-play2')?.addEventListener('click', () => {
            this.game.startDaily(this.game.dailyManager.todayKey());
        });

        // Home: new game -> levels tab
        document.getElementById('btn-new-game-home')?.addEventListener('click', () => {
            this.game._showTab('levels');
        });

        // Level screen: back -> levels tab
        document.getElementById('btn-level-back')?.addEventListener('click', () => {
            document.getElementById('level-screen').style.display = 'none';
            this.game._showTab('levels');
        });

        // Level screen: random mode
        document.getElementById('btn-random')?.addEventListener('click', () => {
            this.game.startGame(this.game.difficulty, 'random');
        });

        // Continue button
        document.getElementById('btn-continue')?.addEventListener('click', () => {
            this.game.continueGame();
        });
    }

    _setupCanvasInput() {
        const canvas = this.game.renderer.canvas;

        canvas.addEventListener('click', (e) => {
            const cell = this.game.renderer.getCellFromPoint(e.clientX, e.clientY);
            if (cell) {
                this.game.selectCell(cell.row, cell.col);
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            const cell = this.game.renderer.getCellFromPoint(touch.clientX, touch.clientY);
            if (cell) {
                this.game.selectCell(cell.row, cell.col);
            }
        });
    }

    _setupNumPad() {
        for (let i = 1; i <= 9; i++) {
            const btn = document.getElementById(`num-${i}`);
            if (btn) {
                btn.addEventListener('click', () => {
                    this.game.inputNumber(i);
                });
            }
        }
    }

    _setupToolbar() {
        document.getElementById('btn-home')?.addEventListener('click', () => this.game.goHome());
        document.getElementById('btn-undo')?.addEventListener('click', () => this.game.undo());
        document.getElementById('btn-note')?.addEventListener('click', () => this.game.toggleNoteMode());
        document.getElementById('btn-autonote')?.addEventListener('click', () => this.game.autoNote());
        document.getElementById('btn-erase')?.addEventListener('click', () => this.game.erase());
        document.getElementById('btn-hint')?.addEventListener('click', () => this.game.useHint());
        document.getElementById('btn-pause')?.addEventListener('click', () => this.game.pause());

        document.getElementById('btn-new-game')?.addEventListener('click', () => {
            document.getElementById('dialog-difficulty').classList.add('active');
            document.getElementById('dialog-overlay').classList.add('active');
        });

        // Unified overlay click
        document.getElementById('dialog-overlay')?.addEventListener('click', (e) => {
            if (e.target !== e.currentTarget) return;
            const diffActive = document.getElementById('dialog-difficulty').classList.contains('active');
            if (diffActive) {
                document.getElementById('dialog-difficulty').classList.remove('active');
                document.getElementById('dialog-overlay').classList.remove('active');
            } else {
                this.game.dialogs.hide();
            }
        });

        // Difficulty selection (in dialogs)
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const diff = btn.dataset.difficulty;
                this.game.dialogs.hide();
                this.game.startGame(diff, 'random');
            });
        });

        // Pause actions
        document.getElementById('btn-resume')?.addEventListener('click', () => this.game.resume());
        document.getElementById('btn-pause-close')?.addEventListener('click', () => this.game.resume());
        document.getElementById('btn-gameover-retry')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            if (this.game.gameMode === 'level') {
                this.game.restartGame();
            } else if (this.game.gameMode === 'daily') {
                this.game.startDaily(this.game.dailyDateKey);
            } else {
                this.game.startGame(this.game.difficulty, 'random');
            }
        });
        document.getElementById('btn-gameover-home')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            Storage.clearGame();
            this.game.gameStarted = false;
            this.game.currentLevel = 1;
            this.game.gameMode = 'random';
            this.game._showStartScreen();
        });
        document.getElementById('btn-restart')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            this.game.dialogs.showConfirm(
                '重新开始', '确定要重新开始吗？进度将丢失。', () => {
                this.game.restartGame();
            });
        });
        document.getElementById('btn-new-from-pause')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            document.getElementById('dialog-difficulty').classList.add('active');
            document.getElementById('dialog-overlay').classList.add('active');
        });

        // Settings
        document.getElementById('btn-settings')?.addEventListener('click', () => {
            document.getElementById('setting-mute').checked = this.game.sound.isMuted();
            document.getElementById('setting-theme').value = document.documentElement.dataset.theme || 'light';
            document.getElementById('setting-hearts').value = this.game.maxLives;
            document.getElementById('setting-disable').checked = this.game.disableImpossible;
            document.getElementById('setting-autonote').checked = this.game.autoNoteEnabled;
            try {
                document.getElementById('setting-fontsize').value = localStorage.getItem('sudoku_fontSize') || 'medium';
            } catch (e) {}
            this.game.dialogs.showSettings();
        });
        document.getElementById('setting-fontsize')?.addEventListener('change', (e) => {
            this.game._applyFontSize(e.target.value);
        });
        document.getElementById('btn-close-settings')?.addEventListener('click', () => this.game.dialogs.hide());
        document.getElementById('setting-mute')?.addEventListener('change', (e) => {
            if (e.target.checked !== this.game.sound.isMuted()) {
                this.game.toggleMute();
            }
        });
        document.getElementById('setting-theme')?.addEventListener('change', (e) => {
            this.game._applyTheme(e.target.value);
            try {
                localStorage.setItem('sudoku_theme', e.target.value);
            } catch (e) {}
            requestAnimationFrame(() => {
                if (this.game.gameStarted) this.game._render();
            });
        });
        document.getElementById('setting-hearts')?.addEventListener('change', (e) => {
            const v = parseInt(e.target.value);
            if (v < 1 || v > 5) return;
            this.game._applyMaxLives(v);
        });
        document.getElementById('setting-disable')?.addEventListener('change', (e) => {
            this.game.disableImpossible = e.target.checked;
            try { localStorage.setItem('sudoku_disableImpossible', e.target.checked); } catch (e) {}
            this.game._updateNumPadHighlight();
        });
        document.getElementById('setting-autonote')?.addEventListener('change', (e) => {
            this.game.autoNoteEnabled = e.target.checked;
            try { localStorage.setItem('sudoku_autoNoteEnabled', e.target.checked); } catch (e) {}
            this.game._updateAutoNoteButton();
        });

        // Confirm dialog
        document.getElementById('confirm-cancel')?.addEventListener('click', () => this.game.dialogs.hide());

        // Victory actions
        document.getElementById('btn-victory-next')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            this.game.startGame(this.game.difficulty, 'level', this.game.currentLevel + 1);
        });
        document.getElementById('btn-victory-restart')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            this.game.restartGame();
        });
        document.getElementById('btn-victory-home')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            Storage.clearGame();
            this.game.gameStarted = false;
            this.game._showStartScreen();
        });
        document.getElementById('btn-victory-new')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            this.game._showStartScreen();
        });
        document.getElementById('btn-victory-replay')?.addEventListener('click', () => {
            this.game.dialogs.hide();
            if (this.game.gameMode === 'daily') {
                this.game.startDaily(this.game.dailyDateKey);
            } else {
                this.game.startGame(this.game.difficulty, 'random');
            }
        });
    }

    _setupKeyboard() {
        document.addEventListener('keydown', (e) => {
            if (document.querySelector('.dialog.active') || document.getElementById('pause-overlay').classList.contains('active')) return;
            if (!this.game.gameStarted) return;

            const key = e.key;
            if (key >= '1' && key <= '9') {
                e.preventDefault();
                if (e.ctrlKey || e.metaKey) {
                    this.game.toggleNoteAtSelected(parseInt(key));
                } else {
                    this.game.inputNumber(parseInt(key));
                }
            } else if (key === 'Backspace' || key === 'Delete' || key === '0') {
                e.preventDefault();
                this.game.erase();
            } else if (key === 'n' || key === 'N') {
                e.preventDefault();
                this.game.toggleNoteMode();
            } else if ((key === 'z' || key === 'Z') && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                if (e.shiftKey) {
                    this.game.redo();
                } else {
                    this.game.undo();
                }
            } else if ((key === 'y' || key === 'Y') && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                this.game.redo();
            } else if (key.startsWith('Arrow')) {
                e.preventDefault();
                this.game.moveSelection(key);
            }
        });
    }
}


// === js/data/storage.js ===
class Storage {
    static save(key, data) {
        try {
            localStorage.setItem(key, JSON.stringify(data));
        } catch (e) {}
    }

    static load(key, defaultValue = null) {
        try {
            const raw = localStorage.getItem(key);
            if (raw === null) return defaultValue;
            return JSON.parse(raw);
        } catch (e) {
            return defaultValue;
        }
    }

    static saveGame(state) {
        this.save('sudoku_game', state);
    }

    static loadGame() {
        return this.load('sudoku_game', null);
    }

    static clearGame() {
        try {
            localStorage.removeItem('sudoku_game');
        } catch (e) {}
    }
}


// === js/data/stats.js ===
class Stats {
    constructor() {
        this.data = {
            totalGames: 0,
            totalWins: 0,
            currentStreak: 0,
            bestStreak: 0,
            bestTimes: {},    // { difficulty: seconds }
            avgTimes: {},     // { difficulty: { total: seconds, count: N } }
            byDifficulty: {}, // { difficulty: { played: N, won: N } }
            history: [],      // recent random-mode wins: { difficulty, timeSec, ts, p, s }
        };
    }

    load() {
        try {
            const saved = JSON.parse(localStorage.getItem('sudoku_stats'));
            if (saved) {
                this.data = { ...this.data, ...saved };
            }
        } catch (e) {}
    }

    save() {
        try {
            localStorage.setItem('sudoku_stats', JSON.stringify(this.data));
        } catch (e) {}
    }

    recordGame(difficulty, won, timeSeconds, extra) {
        const d = this.data;
        d.totalGames++;

        if (!d.byDifficulty[difficulty]) {
            d.byDifficulty[difficulty] = { played: 0, won: 0 };
        }
        d.byDifficulty[difficulty].played++;

        if (won) {
            d.totalWins++;
            d.currentStreak++;
            d.bestStreak = Math.max(d.bestStreak, d.currentStreak);
            d.byDifficulty[difficulty].won++;

            // Best time
            if (!d.bestTimes[difficulty] || timeSeconds < d.bestTimes[difficulty]) {
                d.bestTimes[difficulty] = timeSeconds;
            }

            // Average time
            if (!d.avgTimes[difficulty]) {
                d.avgTimes[difficulty] = { total: 0, count: 0 };
            }
            d.avgTimes[difficulty].total += timeSeconds;
            d.avgTimes[difficulty].count++;
        } else {
            d.currentStreak = 0;
        }

        // History log for random-mode wins (replayable: stores the puzzle)
        if (won && extra && extra.mode === 'random' && extra.p) {
            d.history.unshift({
                difficulty,
                timeSec: timeSeconds,
                ts: Date.now(),
                p: extra.p,
                s: extra.s,
            });
            d.history = d.history.slice(0, 30);
        }
        this.save();
    }

    getSummary() {
        return { ...this.data };
    }

    isNewBest(difficulty, timeSeconds) {
        const best = this.data.bestTimes[difficulty];
        return !best || timeSeconds < best;
    }
}

        this.autoNoteEnabled = false;
        this.levelManager = new LevelManager();
        this.dailyManager = new DailyManager();
        this.gameMode = 'random'; // 'level' or 'random'
        this.currentLevel = 1;
        this.paused = false;
        this.completed = false;
        this.hintCell = null;
        this.hintStep = null;
        this.sameNumHighlight = null;

        this._init();
    }

    async _init() {
        this.stats.load();
        this.hints.load();
        this._loadTheme();
        this._initLang();
        this._loadMaxLives();
        this._loadFontSize();

        this.sound.loadAll();

        this.timer.onChange((timeStr) => {
            document.getElementById('timer-display').textContent = timeStr;
        });

        // Resize canvas first before anything renders
        this._resize();
        window.addEventListener('resize', () => {
            this._resize();
        });

        // Always show start screen first (home tab renders continue button state)
        this._showStartScreen();
    }

    _showLevelScreen(difficulty) {
        this.difficulty = difficulty;
        document.querySelectorAll('.tab-page').forEach(p => p.style.display = 'none');
        document.getElementById('level-screen').style.display = 'flex';
        document.getElementById('level-title').textContent =
            Generator.DIFFICULTY[difficulty].label;

        const grid = document.getElementById('level-grid');
        grid.innerHTML = '';
        const max = this.levelManager.getDisplayedMax(difficulty);
        const current = this.levelManager.getCurrentLevel(difficulty);

        for (let i = 1; i <= max; i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            const stars = this.levelManager.getStars(difficulty, i);
            const unlocked = this.levelManager.isUnlocked(difficulty, i);
            const completed = this.levelManager.isCompleted(difficulty, i);

            if (completed) {
                btn.classList.add('completed');
                btn.innerHTML = i + '<span class="star">' + '★'.repeat(stars) + '</span>';
            } else if (i === current && unlocked) {
                btn.classList.add('current');
                btn.textContent = i;
            } else if (!unlocked) {
                btn.classList.add('locked');
                btn.textContent = '🔒';
            } else {
                btn.textContent = i;
            }

            if (unlocked) {
                btn.addEventListener('click', () => {
                    if (completed) {
                        this._showLevelInfo(difficulty, i);
                    } else {
                        this.startGame(difficulty, 'level', i);
                    }
                });
            }
            grid.appendChild(btn);
        }

        // Scroll the current level into view
        setTimeout(() => {
            const cur = grid.querySelector('.level-btn.current') ||
                        grid.querySelectorAll('.level-btn.completed')[grid.querySelectorAll('.level-btn.completed').length - 1];
            if (cur) cur.scrollIntoView({ block: 'center' });
        }, 50);
    }

    _showLevelInfo(difficulty, level) {
        const rec = this.levelManager.getRecord(difficulty, level);
        const cfg = Generator.DIFFICULTY[difficulty];
        document.getElementById('level-info-title').textContent = cfg.label + ' · 第 ' + level + ' 关';
        const fmt = (sec) => {
            if (sec == null) return '--';
            return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
        };
        let html = '<div class="stat-row"><span class="stat-label">最佳时间</span><span>' + fmt(rec && rec.bestTime) + '</span></div>';
        html += '<div class="stat-row"><span class="stat-label">最近用时</span><span>' + fmt(rec && rec.lastTime) + '</span></div>';
        html += '<div class="stat-row"><span class="stat-label">星级</span><span style="color:#f59e0b">' + '★'.repeat(rec ? rec.stars : 0) + '</span></div>';
        html += '<div class="stat-row"><span class="stat-label">挑战次数</span><span>' + (rec && rec.plays ? rec.plays : 1) + ' 次</span></div>';
        document.getElementById('level-info-body').innerHTML = html;
        document.getElementById('btn-level-info-play').onclick = () => {
            this.dialogs.hide();
            this.startGame(difficulty, 'level', level);
        };
        document.getElementById('btn-level-info-close').onclick = () => this.dialogs.hide();
        this.dialogs.show('dialog-level-info');
    }

    _showTab(tab) {
        this._activeTab = tab;
        document.getElementById('level-screen').style.display = 'none';
        document.querySelectorAll('.tab-page').forEach(p => p.style.display = 'none');
        document.getElementById('tab-' + tab).style.display = 'flex';
        document.querySelectorAll('.nav-item').forEach(n =>
            n.classList.toggle('active', n.dataset.tab === tab));
        if (tab === 'home') this._renderHome();
        else if (tab === 'daily') this._renderDailyTab();
        else if (tab === 'levels') this._renderLevelsTab();
        else if (tab === 'stats') this._renderStatsTab();
    }

    _renderHome() {
        const todayKey = this.dailyManager.todayKey();
        const info = this.dailyManager.getInfo(todayKey);
        const d = new Date();
        document.getElementById('home-daily-date').textContent =
            (d.getMonth() + 1) + '月' + d.getDate() + '日 · ' + Generator.DIFFICULTY[info.difficulty].label;
        document.getElementById('home-daily-status').textContent = info.completed ? '✅' : '';
        document.getElementById('btn-daily-play').textContent = info.completed ? '再玩一次' : '开始游戏';

        const streak = this.dailyManager.getStreak();
        const wins = this.stats.data.totalWins;
        document.getElementById('home-stats').innerHTML =
            '已连续挑战 <b>' + streak + '</b> 天 · 累计通关 <b>' + wins + '</b> 局';

        const saved = Storage.loadGame();
        const btn = document.getElementById('btn-continue');
        if (saved && saved.gameStarted) {
            btn.style.display = 'flex';
            const el = saved.elapsed || 0;
            const t = String(Math.floor(el / 60)).padStart(2, '0') + ':' + String(el % 60).padStart(2, '0');
            let label = Generator.DIFFICULTY[saved.difficulty] ? Generator.DIFFICULTY[saved.difficulty].label : '';
            if (saved.gameMode === 'level') label += ' #' + saved.currentLevel;
            else if (saved.gameMode === 'daily') label = '每日挑战 · ' + label;
            document.getElementById('continue-sub').textContent = '🕐 ' + t + ' · ' + label;
        } else {
            btn.style.display = 'none';
        }
    }

    _renderDailyTab() {
        const now = new Date();
        const y = now.getFullYear(), m = now.getMonth();
        document.getElementById('daily-month-title').textContent = y + '年' + (m + 1) + '月';
        document.getElementById('daily-streak').textContent =
            '🔥 连续挑战 ' + this.dailyManager.getStreak() + ' 天';

        const cal = document.getElementById('daily-calendar');
        cal.innerHTML = '';
        const firstDow = (new Date(y, m, 1).getDay() + 6) % 7; // Mon=0
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const todayKey = this.dailyManager.todayKey();

        for (let i = 0; i < firstDow; i++) {
            const cell = document.createElement('div');
            cell.className = 'daily-day other-month';
            cal.appendChild(cell);
        }
        for (let d = 1; d <= daysInMonth; d++) {
            const key = this.dailyManager.dateKey(y, m, d);
            const info = this.dailyManager.getInfo(key);
            const cell = document.createElement('div');
            cell.className = 'daily-day';
            cell.textContent = d;
            if (key === todayKey) cell.classList.add('today');
            if (info.completed) cell.classList.add('done');
            if (key <= todayKey) {
                cell.classList.add('playable');
                cell.addEventListener('click', () => this.startDaily(key));
            }
            cal.appendChild(cell);
        }

        const info = this.dailyManager.getInfo(todayKey);
        document.getElementById('daily-play-label').textContent =
            info.completed ? '重玩今日挑战' : '开始今日挑战';
    }

    _renderLevelsTab() {
        const list = document.getElementById('diff-list');
        list.innerHTML = '';
        for (const diff of Generator.DIFFICULTY_ORDER) {
            const cfg = Generator.DIFFICULTY[diff];
            const done = this.levelManager.getProgressSummary(diff);
            const max = this.levelManager.getDisplayedMax(diff);
            const pct = Math.min(100, Math.round(done * 100 / max));
            const item = document.createElement('button');
            item.className = 'diff-item';
            item.innerHTML =
                '<div style="flex:1"><div class="diff-item-name">' + cfg.label + '</div>' +
                '<div class="diff-item-bar"><div class="diff-item-bar-fill" style="width:' + pct + '%"></div></div></div>' +
                '<div class="diff-item-progress">' + done + '/' + max + '</div>';
            item.addEventListener('click', () => this._showLevelScreen(diff));
            list.appendChild(item);
        }
    }

    _renderStatsTab() {
        const el = document.getElementById('stats-content');
        const s = this.stats.data;
        const fmt = (sec) => {
            if (sec == null) return '--';
            const mm = Math.floor(sec / 60), ss = sec % 60;
            return (mm ? mm + '分' : '') + ss + '秒';
        };
        let html = '<div class="stat-section">总体</div>';
        html += '<div class="stat-row"><span class="stat-label">累计通关</span><span>' + s.totalWins + ' 局</span></div>';
        html += '<div class="stat-row"><span class="stat-label">最佳连胜</span><span>' + s.bestStreak + ' 局</span></div>';
        html += '<div class="stat-row"><span class="stat-label">每日挑战连续</span><span>' + this.dailyManager.getStreak() + ' 天</span></div>';
        html += '<div class="stat-row"><span class="stat-label">每日挑战累计</span><span>' + Object.keys(this.dailyManager.records).length + ' 天</span></div>';
        html += '<div class="stat-section">各难度（最佳时间 · 胜率 · 过关数）</div>';
        for (const diff of Generator.DIFFICULTY_ORDER) {
            const cfg = Generator.DIFFICULTY[diff];
            const best = s.bestTimes[diff];
            const bd = s.byDifficulty[diff] || { played: 0, won: 0 };
            const rate = bd.played ? Math.round(bd.won * 100 / bd.played) + '%' : '--';
            const levelsDone = this.levelManager.getProgressSummary(diff);
            html += '<div class="stat-row"><span class="stat-label">' + cfg.label + '</span><span>' +
                fmt(best) + ' · ' + rate + ' · ' + levelsDone + '关</span></div>';
        }

        if (s.history && s.history.length) {
            html += '<div class="stat-section">最近通关 · 随机（点击重玩该题）</div>';
            const fmtDate = (ts) => {
                const dd = new Date(ts);
                return (dd.getMonth() + 1) + '月' + dd.getDate() + '日 ' +
                    String(dd.getHours()).padStart(2, '0') + ':' + String(dd.getMinutes()).padStart(2, '0');
            };
            const fmtT = (sec) => String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
            s.history.slice(0, 10).forEach((h, idx) => {
                html += '<div class="stat-row history-row" data-idx="' + idx + '" style="cursor:pointer">' +
                    '<span class="stat-label">' + Generator.DIFFICULTY[h.difficulty].label + ' · ' + fmtDate(h.ts) + '</span>' +
                    '<span>' + fmtT(h.timeSec) + ' ↻</span></div>';
            });
        }
        el.innerHTML = html;

        el.querySelectorAll('.history-row').forEach(row => {
            row.addEventListener('click', () => {
                const h = s.history[parseInt(row.dataset.idx, 10)];
                if (!h) return;
                this.dialogs.showConfirm('重新挑战', '以相同的题目重新挑战这一局？', () => {
                    this.startGame(h.difficulty, 'random', 1, { p: h.p, s: h.s });
                });
            });
        });
    }

    _showStartScreen() {
        document.getElementById('top-nav').style.display = 'none';
        document.getElementById('info-bar').style.display = 'none';
        document.getElementById('toolbar-actions').style.display = 'none';
        document.getElementById('numpad').style.display = 'none';
        document.getElementById('board-container').style.display = 'none';
        document.getElementById('bottom-spacer').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
        this._showTab(this._activeTab || 'home');
    }

    goHome() {
        if (this.gameStarted) {
            this._save();
            this.timer.pause();
            this.gameStarted = false;
        }
        this.paused = false;
        this.dialogs.hide();
        this._showStartScreen();
    }

    _hideStartScreen() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('bottom-spacer').style.display = 'block';
        document.getElementById('board-container').style.display = 'flex';
        document.getElementById('top-nav').style.display = 'flex';
        document.getElementById('info-bar').style.display = 'flex';
        document.getElementById('toolbar-actions').style.display = 'flex';
        document.getElementById('numpad').style.display = 'grid';
        document.getElementById('pause-overlay').classList.remove('active');
    }

    _initLang() {
        const lang = navigator.language.startsWith('zh') ? 'zh' : 'en';
        setLang(lang);
        try {
            const saved = localStorage.getItem('sudoku_lang');
            if (saved) setLang(saved);
        } catch (e) {}
    }

    _loadTheme() {
        try {
            const theme = localStorage.getItem('sudoku_theme') || 'auto';
            this._applyTheme(theme);
        } catch (e) {}
    }

    _applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        this._syncStatusBar();
        // Listen for system theme changes when in auto mode
        if (!this._themeMediaQuery) {
            this._themeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            this._themeMediaQuery.addEventListener('change', () => {
                if (document.documentElement.dataset.theme === 'auto') {
                    this._render();
                    this._syncStatusBar();
                }
            });
        }
    }

    _syncStatusBar() {
        const style = getComputedStyle(document.documentElement);
        const bg = style.getPropertyValue('--bg-primary').trim();
        if (window.SudokuApp && window.SudokuApp.setStatusBarColor) {
            window.SudokuApp.setStatusBarColor(bg);
        }
    }

    _loadMaxLives() {
        try {
            const v = parseInt(localStorage.getItem('sudoku_maxLives'));
            if (v >= 1 && v <= 5) this.maxLives = v;
            this.disableImpossible = localStorage.getItem('sudoku_disableImpossible') === 'true';
            this.autoNoteEnabled = localStorage.getItem('sudoku_autoNoteEnabled') === 'true';
        } catch (e) {}
    }

    _loadFontSize() {
        try {
            const v = localStorage.getItem('sudoku_fontSize') || 'medium';
            this._applyFontSize(v);
        } catch (e) {}
    }

    _applyFontSize(size) {
        const scale = { small: 0.82, medium: 1.0, large: 1.18 }[size] || 1.0;
        document.documentElement.style.setProperty('--font-scale', scale);
        try { localStorage.setItem('sudoku_fontSize', size); } catch (e) {}
        if (this.gameStarted) this._render();
    }

    _applyMaxLives(newMax) {
        const oldMax = this.maxLives;
        const errors = oldMax - this.lives; // mistakes already made

        if (!this.gameStarted) {
            this.maxLives = newMax;
            this.lives = newMax;
            try { localStorage.setItem('sudoku_maxLives', newMax); } catch (e) {}
            this._updateHeartsDisplay();
            return;
        }

        if (newMax <= errors) {
            // New max would not cover existing errors: game over
            const resetCancel = () => {
                document.getElementById('confirm-cancel').onclick = null;
            };
            this.dialogs.showConfirm(
                '确认修改红心数',
                '已错误' + errors + '次，改为最大' + newMax + '颗心将立即结束游戏。确定修改吗？',
                () => {
                    this.maxLives = newMax;
                    try { localStorage.setItem('sudoku_maxLives', newMax); } catch (e) {}
                    this.lives = 0;
                    this._updateHeartsDisplay();
                    resetCancel();
                    this._gameOver();
                }
            );
            document.getElementById('confirm-cancel').onclick = () => {
                document.getElementById('setting-hearts').value = oldMax;
                resetCancel();
                this.dialogs.hide();
            };
        } else {
            // newMax > errors: can safely apply
            this.maxLives = newMax;
            this.lives = newMax - errors;
            try { localStorage.setItem('sudoku_maxLives', newMax); } catch (e) {}
            this._updateHeartsDisplay();
        }
    }

    _updateHeartsDisplay() {
        const el = document.getElementById('hearts-display');
        if (!el) return;
        let html = '';
        for (let i = 0; i < this.maxLives; i++) {
            if (i < this.lives) {
                html += '❤️';
            } else {
                html += '<span class="heart-lost">🖤</span>';
            }
        }
        el.innerHTML = html;
    }

    continueGame() {
        const saved = Storage.loadGame();
        if (!saved || !saved.gameStarted) return;

        if (!this._restoreGame(saved)) return;
        this.gameStarted = true;
        this._hideStartScreen();
        this._updateDifficultyLabel();
        this._updateToolbarState();
        this._updateHeartsDisplay();
        this._resize();
        this._updateNumPadHighlight();
        this._render();
    }

    startDaily(key) {
        this.dailyDateKey = key || this.dailyManager.todayKey();
        const info = this.dailyManager.getInfo(this.dailyDateKey);
        this.startGame(info.difficulty, 'daily', 0);
    }

    startGame(difficulty, mode, level, puzzleOverride) {
        this.difficulty = difficulty;
        this.gameMode = mode || 'random';
        this.currentLevel = level || 1;

        let puzzle, solution;
        if (this.gameMode === 'level') {
            const data = this.levelManager.getPuzzle(difficulty, this.currentLevel);
            puzzle = data.puzzle;
            solution = data.solution;
        } else if (this.gameMode === 'daily') {
            const data = this.dailyManager.getPuzzle(this.dailyDateKey);
            puzzle = data.puzzle;
            solution = data.solution;
        } else if (puzzleOverride) {
            const data = this.levelManager._parse(puzzleOverride.p, puzzleOverride.s);
            puzzle = data.puzzle;
            solution = data.solution;
        } else {
            const result = Generator.generate(difficulty);
            puzzle = result.puzzle;
            solution = result.solution;
        }

        this.board.reset();
        this.board.load(puzzle, solution);
        this.history.reset();
        this.timer.reset();
        this.timer.start();
        this.hints.reset();
        this.gameStarted = true;
        this.noteMode = false;
        this.paused = false;
        this.completed = false;
        this.hintCell = null;
        this.hintStep = null;
        this.sameNumHighlight = null;
        this._pendingHint = null;
        this.lives = this.maxLives;
        this.selectCell(-1, -1);

        this._hideStartScreen();
        this._updateHeartsDisplay();
        this._updateDifficultyLabel();
        this._updateToolbarState();
        this._resize();
        this._render();
        this._save();

        this.sound.play('chouka');
    }

    _restoreGame(saved) {
        // Guard against old-format/corrupt saves (cross-version upgrades keep localStorage)
        if (!saved || !Array.isArray(saved.puzzle) || !Array.isArray(saved.solution) ||
            !Array.isArray(saved.grid) || !Array.isArray(saved.notes) ||
            saved.puzzle.length !== 9 || saved.solution.length !== 9 ||
            saved.grid.length !== 9 || saved.notes.length !== 9) {
            Storage.clearGame();
            return false;
        }
        this.difficulty = saved.difficulty;
        this.board.reset();
        this.board.load(saved.puzzle, saved.solution);

        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                this.board.grid[r][c] = saved.grid[r][c];
                if (saved.notes[r][c]) {
                    this.board.notes[r][c] = new Set(saved.notes[r][c]);
                }
            }
        }

        this.timer.elapsed = saved.elapsed || 0;
        this.timer.start();
        this.noteMode = saved.noteMode || false;
        // ?? null: 旧存档缺失字段时是 undefined，_updateNumPadHighlight 的 === null 守卫会漏掉
        this.selectedRow = saved.selectedRow ?? null;
        this.selectedCol = saved.selectedCol ?? null;
        this.hints.remaining = HINT_UNLIMITED ? 999 : (saved.hintRemaining ?? 3);
        this.hints.autoNoteUsed = saved.autoNoteUsed ?? false;
        this.hints.autoNoteCleared = saved.autoNoteCleared ?? false;
        this.lives = saved.lives ?? this.maxLives;
        this.maxLives = saved.maxLives ?? 3;
        this.autoNoteEnabled = saved.autoNoteEnabled ?? false;
        this.gameMode = saved.gameMode || 'random';
        this.currentLevel = saved.currentLevel || 1;
        this.dailyDateKey = saved.dailyDateKey;

        if (saved.historyStack) {
            this.history.stack = saved.historyStack;
            this.history.pointer = saved.historyPointer;
        }

        this.paused = false;
        this._updateDifficultyLabel();
        this._updateToolbarState();
        this._resize();
        return true;
    }

    selectCell(row, col) {
        if (this.paused || this.completed) return;

        this.hintCell = null;
        // Only clear pending hint if selecting a different cell
        if (row !== this.selectedRow || col !== this.selectedCol) {
            this._pendingHint = null;
        }

        if (row === -1 || col === -1) {
            this.selectedRow = null;
            this.selectedCol = null;
            this.sameNumHighlight = null;
            this._hideSmartHint();
            this._updateNumPadHighlight();
            this._render();
            return;
        }

        this.selectedRow = row;
        this.selectedCol = col;

        const val = this.board.getCell(row, col);
        this.sameNumHighlight = (val !== 0) ? val : null;

        this._updateNumPadHighlight();
        this._render();
    }

    inputNumber(num) {
        if (this.paused || this.completed) return;
        if (this.selectedRow === null || this.selectedCol === null) return;
        // Number already fully placed — cannot select
        if (document.getElementById('num-' + num).classList.contains('filled')) return;

        const r = this.selectedRow;
        const c = this.selectedCol;

        if (this.noteMode) {
            this._toggleNote(r, c, num);
            return;
        }

        if (this.board.isGiven(r, c)) return;

        const oldVal = this.board.getCell(r, c);
        const oldNotes = new Set(this.board.getNotes(r, c));

        // Locked: correct answer cannot be changed
        if (oldVal !== 0 && this.board.isCorrect(r, c)) return;

        if (oldVal === num) return;

        this.board.setCell(r, c, num);
        this.sameNumHighlight = (num !== 0) ? num : null;

        let relatedNotes = [];
        if (num !== 0 && this.board.isCorrect(r, c)) {
            this.sound.play('num_right');
            relatedNotes = this._removeRelatedNotes(num, r, c);
        }

        this.history.push({
            type: oldVal === 0 && oldNotes.size === 0 ? ActionType.FILL :
                  num === 0 ? ActionType.ERASE : ActionType.FILL,
            row: r, col: c,
            oldValue: oldVal, newValue: num,
            oldNotes: [...oldNotes], newNotes: [],
            relatedNotes,
        });

        this.sound.play('num_click');
        this.sound.vibrate(8);

        if (num !== 0 && !this.board.isCorrect(r, c)) {
            this.sound.play('num_error');
            this.sound.vibrate(30);
            this.lives--;
            this._updateHeartsDisplay();
            if (this.lives <= 0) {
                this._gameOver();
                return;
            }
        }

        this._updateNumPadHighlight();
        this._render();
        this._checkCompletion();
        this._save();
    }

    _toggleNote(r, c, num) {
        if (this.board.isGiven(r, c) || this.board.getCell(r, c) !== 0) return;

        const oldNotes = new Set(this.board.getNotes(r, c));
        this.board.toggleNote(r, c, num);
        const newNotes = new Set(this.board.getNotes(r, c));

        this.history.push({
            type: ActionType.NOTE_TOGGLE,
            row: r, col: c,
            oldValue: 0, newValue: 0,
            oldNotes: [...oldNotes], newNotes: [...newNotes],
        });

        this.sound.play('prop_note');
        this._updateNumPadHighlight();
        this._render();
        this._save();
    }

    toggleNoteAtSelected(num) {
        if (this.selectedRow === null || this.selectedCol === null) return;
        this._toggleNote(this.selectedRow, this.selectedCol, num);
    }

    toggleNoteMode() {
        this.noteMode = !this.noteMode;
        this.sound.play('btn_click');
        this._updateToolbarState();
        this._updateNumPadHighlight();
    }

    erase() {
        if (this.paused || this.completed) return;
        if (this.selectedRow === null || this.selectedCol === null) return;

        const r = this.selectedRow;
        const c = this.selectedCol;

        if (this.board.isGiven(r, c)) return;

        const oldVal = this.board.getCell(r, c);
        const oldNotes = new Set(this.board.getNotes(r, c));

        if (oldVal === 0 && oldNotes.size === 0) return;

        this.board.clearCell(r, c);
        this.sameNumHighlight = null;

        this.history.push({
            type: ActionType.ERASE,
            row: r, col: c,
            oldValue: oldVal, newValue: 0,
            oldNotes: [...oldNotes], newNotes: [],
        });

        this.sound.play('eraserecall');
        this._updateNumPadHighlight();
        this._render();
        this._save();
    }

    undo() {
        if (this.paused || this.completed) return;

        const action = this.history.undo();
        if (!action) return;

        this._applyAction(action);
        this.sound.play('eraserecall');
        this._render();
        this._save();
    }

    redo() {
        if (this.paused || this.completed) return;

        const action = this.history.redo();
        if (!action) return;

        this._applyAction(action);
        this.sound.play('btn_click');
        this._render();
        this._save();
    }

    _applyAction(action) {
        const { row, col, direction } = action;
        if (direction === 'undo') {
            this.board.grid[row][col] = action.oldValue;
            this.board.notes[row][col] = new Set(action.oldNotes);
            if (action.relatedNotes && action.newValue !== 0) {
                for (const rn of action.relatedNotes) {
                    if (this.board.grid[rn.r][rn.c] !== 0) continue;
                    for (const n of rn.notes) this.board.notes[rn.r][rn.c].add(n);
                }
            }
            this.selectCell(row, col);
        } else {
            this.board.grid[row][col] = action.newValue;
            this.board.notes[row][col] = new Set(action.newNotes);
            if (action.relatedNotes && action.newValue !== 0) {
                for (const rn of action.relatedNotes) {
                    for (const n of rn.notes) this.board.notes[rn.r][rn.c].delete(n);
                }
            }
            this.selectCell(row, col);
        }
    }

    useHint() {
        if (this.paused || this.completed) return;

        if (!this.hints.canUse()) {
            this.sound.play('num_error');
            this._shakeElement(document.getElementById('btn-hint'));
            return;
        }

        let r, c, answer, explanation, steps;

        // Technique-based hint: naked/hidden single, locked candidates, pairs, X-Wing...
        const move = HintEngine.findMove(this.board.grid);
        if (move && move.digit === this.board.getHint(move.r, move.c)) {
            r = move.r;
            c = move.c;
            answer = move.digit;
            explanation = move.explanation;
            steps = move.steps;
        } else {
            // Fallback (e.g. user errors on board): most constrained cell + solution value
            let bestCell = null, bestCount = 10;
            for (let rr = 0; rr < 9; rr++) {
                for (let cc = 0; cc < 9; cc++) {
                    if (!this.board.isGiven(rr, cc) &&
                        (this.board.isEmpty(rr, cc) || !this.board.isCorrect(rr, cc))) {
                        const candidates = Validator.getCandidates(this.board.grid, rr, cc);
                        if (candidates.length < bestCount && candidates.length > 0) {
                            bestCount = candidates.length;
                            bestCell = { r: rr, c: cc };
                        }
                    }
                }
            }
            if (!bestCell) return;
            r = bestCell.r;
            c = bestCell.c;
            answer = this.board.getHint(r, c);
            const reasonResult = this._buildHintReason(r, c, answer);
            if (reasonResult) {
                explanation = reasonResult.text;
                steps = reasonResult.steps;
            } else {
                const contMove = HintEngine.findMoveWithContradiction(this.board.grid);
                if (contMove && contMove.digit === this.board.getHint(contMove.r, contMove.c)) {
                    r = contMove.r;
                    c = contMove.c;
                    answer = contMove.digit;
                    explanation = contMove.explanation;
                    steps = contMove.steps;
                } else {
                    const cands = Validator.getCandidates(this.board.grid, r, c);
                    explanation = '【候选分析】' + HintEngine._cellName(r, c) + '当前候选数为[' + cands.join(',') + ']，该格受行列宫多重交叉约束，需组合排除法推导。建议先用候选笔记辅助分析。';
                    steps = [
                        { text: '注意' + HintEngine._cellName(r, c) + '（高亮格），它的候选数字是 [' + cands.join(',') + ']', region: { cells: [[r, c]] } },
                        { text: '该格同时受所在行、列、宫的多重约束，当前没有单一的技巧能直接确定数字', cells: HintEngine._filledNeighbors(this.board.grid, r, c) },
                        { text: '建议先用一键笔记记录候选，再配合上面的技巧逐步推导' },
                    ];
                }
            }
        }

        this._hideSmartHint();
        this.selectCell(r, c);
        this._pendingHint = { r, c, answer, explanation, steps };
        this.hints.use();
        this._showSmartHint(answer, explanation, r, c, steps);
        this.sound.play('prop_notice');
        this._render();
    }

    _buildHintReason(row, col, answer) {
        const rowNums = new Set();
        let rowEmpty = 0;
        for (let i = 0; i < 9; i++) {
            if (this.board.grid[row][i] !== 0) rowNums.add(this.board.grid[row][i]);
            else rowEmpty++;
        }
        const colNums = new Set();
        let colEmpty = 0;
        for (let i = 0; i < 9; i++) {
            if (this.board.grid[i][col] !== 0) colNums.add(this.board.grid[i][col]);
            else colEmpty++;
        }
        const boxNums = new Set();
        let boxEmpty = 0;
        const br = Math.floor(row / 3) * 3, bc = Math.floor(col / 3) * 3;
        for (let r = br; r < br + 3; r++)
            for (let c = bc; c < bc + 3; c++)
                if (this.board.grid[r][c] !== 0) boxNums.add(this.board.grid[r][c]);
                else boxEmpty++;
        const cands = Validator.getCandidates(this.board.grid, row, col);
        if (cands.length === 1) {
            const cellName = HintEngine._cellName(row, col);
            const filled = HintEngine._filledNeighbors(this.board.grid, row, col);
            let text;
            if (rowEmpty === 1) text = '【唯余法】第'+(row+1)+'行只剩这一格未填，必须填'+answer;
            else if (colEmpty === 1) text = '【唯余法】第'+(col+1)+'列只剩这一格未填，必须填'+answer;
            else if (boxEmpty === 1) text = '【唯余法】该宫只剩这一格未填，必须填'+answer;
            else text = '【唯一候选】该格所在行、列、宫已包含其他8个数字，必须填'+answer;
            const steps = [
                { text: '注意' + cellName + '（高亮格），它所在的这一行、列、宫只剩一个候选数字 ' + answer, region: { cells: [[row, col]] } },
                { text: '该格所在的行已有[' + [...rowNums].join(',') + ']，列已有[' + [...colNums].join(',') + ']，宫已有[' + [...boxNums].join(',') + ']，只有 ' + answer + ' 没有出现过', cells: filled },
                { text: '因此' + cellName + '必须填 ' + answer, target: [row, col] },
            ];
            return { text, steps };
        }
        return null;
    }

    _applyHint() {
        if (!this._pendingHint) return;
        const { r, c, answer } = this._pendingHint;
        this._pendingHint = null;

        const oldVal = this.board.getCell(r, c);
        const oldNotes = new Set(this.board.getNotes(r, c));

        this.board.setCell(r, c, answer);
        this.board.notes[r][c].clear();
        const relatedNotes = this._removeRelatedNotes(answer, r, c);

        this.history.push({
            type: ActionType.HINT,
            row: r, col: c,
            oldValue: oldVal, newValue: answer,
            oldNotes: [...oldNotes], newNotes: [],
            relatedNotes,
        });

        this.hintCell = { r, c };
        this.selectCell(r, c);
        this.sound.play('num_right');

        this._updateHintButton();
        this._updateNumPadHighlight();
        this._render();
        this._checkCompletion();
        this._save();

        setTimeout(() => {
            this.hintCell = null;
            this._render();
        }, 1500);
    }

    moveSelection(dir) {
        if (this.paused || this.completed) return;
        let { selectedRow: r, selectedCol: c } = this;
        if (r === null) { r = 0; c = 0; }
        switch (dir) {
            case 'ArrowUp': r = Math.max(0, r - 1); break;
            case 'ArrowDown': r = Math.min(8, r + 1); break;
            case 'ArrowLeft': c = Math.max(0, c - 1); break;
            case 'ArrowRight': c = Math.min(8, c + 1); break;
        }
        this.selectCell(r, c);
    }

    pause(silent) {
        if (this.completed || !this.gameStarted) return;
        this.paused = true;
        this.timer.pause();
        document.getElementById('pause-overlay').classList.add('active');
        if (!silent) this.sound.play('btn_click');
    }

    resume() {
        this.paused = false;
        this.timer.start();
        document.getElementById('pause-overlay').classList.remove('active');
        document.getElementById('dialog-overlay').classList.remove('active');
        document.querySelectorAll('.dialog').forEach(d => d.classList.remove('active'));
    }

    toggleMute() {
        const muted = this.sound.toggle();
        const checkbox = document.getElementById('setting-mute');
        if (checkbox) checkbox.checked = muted;
    }

    autoNote() {
        if (this.paused || this.completed) return;
        const btn = document.getElementById('btn-autonote');
        if (!this.autoNoteEnabled) {
            this.sound.play('num_error');
            this._shakeElement(btn);
            this._showAutoNoteTooltip();
            return;
        }
        if (this.hints.autoNoteUsed && this.hints.autoNoteCleared) {
            this.sound.play('num_error');
            this._shakeElement(btn);
            this._showAutoNoteUsedTooltip();
            return;
        }
        if (this.hints.autoNoteUsed && !this.hints.autoNoteCleared) {
            this.board.clearAllNotes();
            this.hints.autoNoteCleared = true;
            this.sound.play('eraserecall');
            this._updateAutoNoteButton();
            this._updateNumPadHighlight();
            this._render();
            this._save();
            return;
        }
        this.hints.useAutoNote();
        this.board.autoFillNotes();
        this.sound.play('prop_note');
        this._updateAutoNoteButton();
        this._updateNumPadHighlight();
        this._render();
        this._save();
    }

    restartGame() {
        // Restart the SAME puzzle from initial state
        this.history.reset();
        this.timer.reset();
        this.timer.start();
        this.hints.reset();
        this.gameStarted = true;
        this.noteMode = false;
        this.paused = false;
        this.completed = false;
        this.hintCell = null;
        this.hintStep = null;
        document.getElementById('pause-overlay').classList.remove('active');
        this.dialogs.hide();
        this.hintCell = null;
        this.sameNumHighlight = null;
        this._pendingHint = null;
        this.lives = this.maxLives;
        // Reset grid to initial puzzle (only given cells)
        for (let r = 0; r < 9; r++)
            for (let c = 0; c < 9; c++)
                if (!this.board.given[r][c]) {
                    this.board.grid[r][c] = 0;
                    this.board.notes[r][c].clear();
                }
        this.selectCell(-1, -1);
        this._updateHeartsDisplay();
        this._updateToolbarState();
        this._updateNumPadHighlight();
        this._resize();
        this._render();
        this._save();
        this.sound.play('chouka');
    }

    _gameOver() {
        this.completed = true;
        this.timer.pause();
        const timeStr = this.timer.getFormatted();
        const timeSec = this.timer.getTime();

        this.stats.recordGame(this.difficulty, false, timeSec);

        setTimeout(() => {
            this.sound.play('over_fail');
            document.getElementById('gameover-time').textContent = '用时 ' + timeStr;
            this.dialogs.show('dialog-gameover');
        }, 600);
        this._render();
        Storage.clearGame();
    }

    _removeRelatedNotes(num, row, col) {
        const removed = this.board.removeNoteFromRelated(num, row, col);
        if (removed.length > 0) {
            this._updateNumPadHighlight();
            this._render();
            this._save();
        }
        return removed;
    }

    _updateNumCounts() {
        // Count correctly placed occurrences of each number 1-9
        const counts = {};
        for (let n = 1; n <= 9; n++) counts[n] = 0;
        for (let r = 0; r < 9; r++)
            for (let c = 0; c < 9; c++) {
                const v = this.board.grid[r][c];
                if (v !== 0 && this.board.isCorrect(r, c)) counts[v]++;
            }
        for (let n = 1; n <= 9; n++) {
            const remain = 9 - counts[n];
            const el = document.querySelector('#num-' + n + ' .num-remain');
            if (el) el.textContent = remain;
            const btn = document.getElementById('num-' + n);
            if (btn) {
                if (remain <= 0) btn.classList.add('filled');
                else btn.classList.remove('filled');
            }
        }
    }

    _updateNumPadHighlight() {
        for (let i = 1; i <= 9; i++) {
            const btn = document.getElementById('num-' + i);
            if (btn) { btn.classList.remove('note-highlight', 'last-candidate', 'impossible'); }
        }
        this._updateNumCounts();
        if (this.selectedRow === null || this.selectedCol === null) return;
        const r = this.selectedRow, c = this.selectedCol;
        if (this.noteMode && this.board.getCell(r, c) === 0) {
            const notes = this.board.getNotes(r, c);
            for (const n of notes) {
                const btn = document.getElementById('num-' + n);
                if (btn) btn.classList.add('note-highlight');
            }
        }
        // 空格或填错的格子都可以触发末位候选
        // isEmpty cells return isCorrect=true, so check isEmpty explicitly
        if (!this.board.isGiven(r, c) && (this.board.isEmpty(r, c) || !this.board.isCorrect(r, c))) {
            this._checkLastCandidate(r, c);
        }
    }

    _checkLastCandidate(row, col) {
        // Count CORRECT cells in row/col/box
        let rowCorrect = 0, rowCorrectSet = new Set(), rowWrongCol = -1;
        for (let i = 0; i < 9; i++) {
            const v = this.board.grid[row][i];
            if (v !== 0 && this.board.isCorrect(row, i)) {
                rowCorrect++;
                rowCorrectSet.add(v);
            } else if (i !== col) {
                rowWrongCol = i; // Another cell is wrong/empty -> not 8-correct
            }
        }
        // Row is ready if: 8 correct + the non-correct cell IS this cell
        const rowReady = (rowCorrect === 8 && rowWrongCol === -1);

        let colCorrect = 0, colCorrectSet = new Set(), colWrongRow = -1;
        for (let i = 0; i < 9; i++) {
            const v = this.board.grid[i][col];
            if (v !== 0 && this.board.isCorrect(i, col)) {
                colCorrect++;
                colCorrectSet.add(v);
            } else if (i !== row) {
                colWrongRow = i;
            }
        }
        const colReady = (colCorrect === 8 && colWrongRow === -1);

        let boxCorrect = 0, boxCorrectSet = new Set(), boxWrongCount = 0;
        const br = Math.floor(row / 3) * 3, bc = Math.floor(col / 3) * 3;
        for (let r = br; r < br + 3; r++)
            for (let c = bc; c < bc + 3; c++) {
                const v = this.board.grid[r][c];
                if (v !== 0 && this.board.isCorrect(r, c)) {
                    boxCorrect++;
                    boxCorrectSet.add(v);
                } else if (!(r === row && c === col)) {
                    boxWrongCount++;
                }
            }
        const boxReady = (boxCorrect === 8 && boxWrongCount === 0);

        // Find missing numbers
        let rowMissing = 0, colMissing = 0, boxMissing = 0;
        if (rowReady) for (let n = 1; n <= 9; n++) if (!rowCorrectSet.has(n)) rowMissing = n;
        if (colReady) for (let n = 1; n <= 9; n++) if (!colCorrectSet.has(n)) colMissing = n;
        if (boxReady) for (let n = 1; n <= 9; n++) if (!boxCorrectSet.has(n)) boxMissing = n;

        const uniqueNums = new Set();
        if (rowMissing) uniqueNums.add(rowMissing);
        if (colMissing) uniqueNums.add(colMissing);
        if (boxMissing) uniqueNums.add(boxMissing);

        // Get all possible candidates for this cell
        const allCands = new Set(Validator.getCandidates(this.board.grid, row, col));

        // Highlight last-candidate numbers AND disable others
        if (uniqueNums.size > 0) {
            for (let n = 1; n <= 9; n++) {
                const btn = document.getElementById('num-' + n);
                if (btn) {
                    if (uniqueNums.has(n)) {
                        btn.classList.add('last-candidate');
                        btn.classList.remove('impossible');
                    } else {
                        btn.classList.add('impossible');
                    }
                }
            }
        } else if (this.disableImpossible && allCands.size > 0) {
            // Normal mode: disable impossible numbers (only when setting enabled)
            for (let n = 1; n <= 9; n++) {
                const btn = document.getElementById('num-' + n);
                if (btn) {
                    if (!allCands.has(n)) {
                        btn.classList.add('impossible');
                    } else {
                        btn.classList.remove('impossible');
                    }
                }
            }
        }
    }

    _showSmartHint(num, reason, row, col, steps) {
        const hintEl = document.getElementById('smart-hint');
        const reasonEl = document.getElementById('smart-hint-reason');
        const backdrop = document.getElementById('hint-backdrop');
        if (!hintEl || !reasonEl) return;

        this._hintSteps = steps && steps.length ? steps : null;
        this._hintStepIndex = 0;

        const renderStep = () => {
            const idx = this._hintStepIndex;
            const total = this._hintSteps ? this._hintSteps.length : 1;

            const stepsEl = document.getElementById('smart-hint-steps');
            if (stepsEl) {
                if (this._hintSteps) {
                    let dots = '';
                    for (let i = 0; i < total; i++) {
                        dots += '<span class="smart-hint-step-dot' + (i === idx ? ' active' : '') + '"></span>';
                    }
                    stepsEl.textContent = '';
                    stepsEl.innerHTML = '步骤 ' + (idx + 1) + '/' + total;
                    const dotWrap = document.createElement('span');
                    dotWrap.style.display = 'inline-flex';
                    dotWrap.style.gap = '4px';
                    dotWrap.style.marginLeft = '6px';
                    dotWrap.innerHTML = dots;
                    stepsEl.appendChild(dotWrap);
                } else {
                    stepsEl.innerHTML = '';
                }
            }

            if (this._hintSteps) {
                reasonEl.textContent = this._hintSteps[idx].text;
            } else {
                reasonEl.textContent = reason;
            }

            // 同步棋盘高亮：当前步的 region/cells/target
            this.hintStep = this._hintSteps ? this._hintSteps[idx] : null;
            this._render();

            const prevBtn = document.getElementById('smart-hint-prev');
            const applyBtn = document.getElementById('smart-hint-apply');
            if (prevBtn) prevBtn.style.visibility = idx > 0 ? 'visible' : 'hidden';
            if (applyBtn) applyBtn.textContent = (this._hintSteps && idx < total - 1) ? '下一步' : '应用';
        };

        document.getElementById('smart-hint-apply').onclick = () => {
            if (this._hintSteps && this._hintStepIndex < this._hintSteps.length - 1) {
                this._hintStepIndex++;
                renderStep();
                return;
            }
            this._hideSmartHint();
            if (this._pendingHint) {
                this._applyHint();
            } else {
                this.selectCell(row, col);
                this.inputNumber(num);
            }
        };
        document.getElementById('smart-hint-prev').onclick = () => {
            if (this._hintStepIndex > 0) {
                this._hintStepIndex--;
                renderStep();
            }
        };
        document.getElementById('smart-hint-close').onclick = () => {
            this._hideSmartHint();
            this._pendingHint = null;
        };
        // Clicking backdrop dismisses without consuming hint
        if (backdrop) {
            backdrop.onclick = () => {
                this._hideSmartHint();
                this._pendingHint = null;
            };
            backdrop.classList.add('active');
        }
        renderStep();
        hintEl.style.display = 'flex';
        // Use fixed bottom positioning — always visible regardless of cell
        hintEl.style.bottom = '80px';
        hintEl.style.left = '50%';
        hintEl.style.transform = 'translateX(-50%)';
        hintEl.style.top = 'auto';
    }

    _hideSmartHint() {
        const hintEl = document.getElementById('smart-hint');
        const backdrop = document.getElementById('hint-backdrop');
        this.hintStep = null;
        this._hintSteps = null;
        this._hintStepIndex = 0;
        if (hintEl) {
            hintEl.style.display = 'none';
            hintEl.style.bottom = '';
            hintEl.style.left = '';
            hintEl.style.transform = '';
            hintEl.style.top = '';
        }
        if (backdrop) backdrop.classList.remove('active');
    }

    _updateAutoNoteButton() {
        const btn = document.getElementById('btn-autonote');
        const icon = document.getElementById('btn-autonote-icon');
        const text = document.getElementById('btn-autonote-text');
        if (!btn) return;
        if (!this.autoNoteEnabled) {
            btn.classList.add('auto-note-disabled');
            btn.classList.remove('disabled');
            if (icon) icon.textContent = '✍';
            if (text) text.textContent = '一键笔记';
        } else if (this.hints.autoNoteUsed && !this.hints.autoNoteCleared) {
            btn.classList.remove('disabled', 'auto-note-disabled');
            if (icon) icon.textContent = '🧹';
            if (text) text.textContent = '一键擦除';
        } else if (this.hints.autoNoteUsed && this.hints.autoNoteCleared) {
            btn.classList.add('disabled');
            btn.classList.remove('auto-note-disabled');
            if (icon) icon.textContent = '✍';
            if (text) text.textContent = '一键笔记';
        } else {
            btn.classList.remove('disabled', 'auto-note-disabled');
            if (icon) icon.textContent = '✍';
            if (text) text.textContent = '一键笔记';
        }
    }

    _checkCompletion() {
        if (this.board.isComplete()) {
            this.completed = true;
            this.timer.pause();
            const timeSec = this.timer.getTime();
            const timeStr = this.timer.getFormatted();

            const diffLabel = Generator.DIFFICULTY[this.difficulty].label;
            let isNewBest;

            // Record completion per mode; isNewBest = beaten a previous record
            if (this.gameMode === 'level') {
                const r = this.levelManager.completeLevel(this.difficulty, this.currentLevel, timeSec);
                isNewBest = r.isNewBest;
            } else if (this.gameMode === 'daily') {
                const prevBest = this.dailyManager.getInfo(this.dailyDateKey).bestTime;
                this.dailyManager.complete(this.dailyDateKey, timeSec);
                isNewBest = prevBest == null || timeSec < prevBest;
            } else {
                isNewBest = this.stats.isNewBest(this.difficulty, timeSec);
            }

            this.stats.recordGame(this.difficulty, true, timeSec, {
                mode: this.gameMode,
                level: this.currentLevel,
                p: this.board.initialPuzzle.map(row => row.join('')).join(''),
                s: this.board.solution.map(row => row.join('')).join(''),
            });

            setTimeout(() => {
                this.sound.play('over_success');
                this.dialogs.showVictory(timeStr, diffLabel, isNewBest, this.gameMode);
                Animations.celebrate(this.renderer.canvas);
            }, 600);

            this._render();
            Storage.clearGame();
        }
    }

    _updateDifficultyLabel() {
        let label = Generator.DIFFICULTY[this.difficulty].label;
        if (this.gameMode === 'level') {
            label += ' #' + this.currentLevel;
        } else if (this.gameMode === 'daily') {
            label = '每日挑战 · ' + label;
        }
        document.getElementById('difficulty-label').textContent = label;
    }

    _updateToolbarState() {
        const noteBtn = document.getElementById('btn-note');
        if (this.noteMode) {
            noteBtn.classList.add('active');
        } else {
            noteBtn.classList.remove('active');
        }
        this._updateHintButton();
        this._updateAutoNoteButton();

        const undoBtn = document.getElementById('btn-undo');
        if (this.history.canUndo()) {
            undoBtn.classList.remove('disabled');
        } else {
            undoBtn.classList.add('disabled');
        }
    }

    _updateHintButton() {
        const hintBtn = document.getElementById('btn-hint');
        const remaining = this.hints.getRemaining();
        const hintLabel = document.getElementById('hint-count');
        if (hintLabel) hintLabel.textContent = HINT_UNLIMITED ? '∞' : remaining;
        if (remaining <= 0) {
            hintBtn.classList.add('disabled');
        } else {
            hintBtn.classList.remove('disabled');
        }
    }

    _shakeElement(el) {
        if (!el) return;
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = 'shake 0.4s ease';
    }

    _save() {
        if (this.completed || !this.gameStarted) return;
        Storage.saveGame({
            difficulty: this.difficulty,
            puzzle: this.board.initialPuzzle.map(row => [...row]),
            solution: this.board.solution.map(row => [...row]),
            grid: this.board.grid.map(row => [...row]),
            given: this.board.given.map(row => [...row]),
            notes: this.board.notes.map(row =>
                row.map(notes => [...notes])
            ),
            elapsed: this.timer.getTime(),
            noteMode: this.noteMode,
            selectedRow: this.selectedRow,
            selectedCol: this.selectedCol,
            historyStack: this.history.stack,
            historyPointer: this.history.pointer,
            gameStarted: true,
            gameMode: this.gameMode,
            currentLevel: this.currentLevel,
            dailyDateKey: this.dailyDateKey,
            hintRemaining: this.hints.remaining,
            autoNoteUsed: this.hints.autoNoteUsed,
            autoNoteCleared: this.hints.autoNoteCleared,
            lives: this.lives,
            maxLives: this.maxLives,
            autoNoteEnabled: this.autoNoteEnabled,
        });
    }

    _resize() {
        const container = document.getElementById('board-container');
        if (!container) return;
        const rect = container.getBoundingClientRect();
        if (rect.width === 0) return; // container hidden (init)
        const cs = getComputedStyle(container);
        const padX = (parseInt(cs.paddingLeft) || 0) + (parseInt(cs.paddingRight) || 0);
        const padY = (parseInt(cs.paddingTop) || 0) + (parseInt(cs.paddingBottom) || 0);
        // Use actual container content area, not window.innerHeight estimate
        const size = Math.min(rect.width - padX, rect.height - padY);
        this.renderer.resize(size, size);

        // Top bars: overhang so controls sit near board edges
        const topBarW = size + 28;
        document.querySelectorAll('#top-nav, #info-bar, #toolbar-actions').forEach(el => {
            el.style.maxWidth = topBarW + 'px';
            el.style.marginLeft = 'auto';
            el.style.marginRight = 'auto';
        });
        // Numpad: exact board alignment (columns line up)
        const numpad = document.getElementById('numpad');
        if (numpad) {
            numpad.style.maxWidth = size + 'px';
            numpad.style.marginLeft = 'auto';
            numpad.style.marginRight = 'auto';
        }

        if (this.gameStarted) {
            this._render();
        }
    }

    _render() {
        if (!this.gameStarted) return;
        const state = {
            selectedRow: this.selectedRow,
            selectedCol: this.selectedCol,
            sameNumHighlight: this.sameNumHighlight,
            hintCell: this.hintCell,
            hintStep: this.hintStep,
            boldNoteNum: this._getBoldNoteNum(),
        };
        this.renderer.draw(this.board, state);
        this._updateToolbarState();
    }

    _getBoldNoteNum() {
        if (this.selectedRow === null || this.selectedCol === null) return 0;
        const val = this.board.getCell(this.selectedRow, this.selectedCol);
        return (val !== 0) ? val : 0;
    }
}

// Android back button handler
window._onBackPressed = function() {
    var boardVisible = document.getElementById('board-container').style.display !== 'none';
    var startVisible = document.getElementById('start-screen').style.display !== 'none';

    if (boardVisible && window.game && window.game.gameStarted) {
        var pauseOverlay = document.getElementById('pause-overlay');
        if (pauseOverlay && pauseOverlay.classList.contains('active')) {
            window.game.resume();
            if (window.SudokuApp) window.SudokuApp.onBackPressed(true);
            return 'true';
        }
        window.game.goHome();
        if (window.SudokuApp) window.SudokuApp.onBackPressed(true);
        return 'true';
    }
    if (startVisible && window.game) {
        var ls = document.getElementById('level-screen');
        if (ls && ls.style.display !== 'none') {
            ls.style.display = 'none';
            window.game._showTab('levels');
            if (window.SudokuApp) window.SudokuApp.onBackPressed(true);
            return 'true';
        }
        if (window.game._activeTab && window.game._activeTab !== 'home') {
            window.game._showTab('home');
            if (window.SudokuApp) window.SudokuApp.onBackPressed(true);
            return 'true';
        }
    }
    if (window.SudokuApp) window.SudokuApp.onBackPressed(false);
    return 'false';
};

// Save game and auto-pause when app is backgrounded or screen locked
document.addEventListener('visibilitychange', function() {
    if (document.hidden && window.game && window.game.gameStarted && !window.game.completed) {
        window.game._save();
        if (!window.game.paused) window.game.pause(true);
    }
});
window.addEventListener('pagehide', function() {
    if (window.game && window.game.gameStarted && !window.game.completed) {
        window.game._save();
    }
});

document.addEventListener("DOMContentLoaded", function() {
    window.game = new SudokuGame();
});

</script>

if ('serviceWorker' in navigator) {

}
